<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시나리오 대장간 — TRPG 시나리오 관리 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1ec;
  --panel: #ffffff;
  --panel-alt: #f6f7f3;
  --line: #dbe2da;
  --line-strong: #c3ccc2;
  --ink: #232922;
  --muted: #667066;
  --faint: #93a091;
  --accent: #3f6d52;
  --accent-ink: #2c4d3b;
  --accent-soft: rgba(63, 109, 82, 0.1);
  --gold: #a97a3a;
  --gold-soft: rgba(169, 122, 58, 0.1);
  --danger: #af4a3d;
  --danger-soft: rgba(175, 74, 61, 0.09);
  --radius: 6px;
  --shadow: 0 1px 2px rgba(35, 41, 34, 0.06), 0 8px 24px rgba(35, 41, 34, 0.06);
  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', 'Pretendard', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
}

input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

::selection { background: var(--accent-soft); }

/* ============ 레이아웃 ============ */
.app {
  display: grid;
  grid-template-columns: 300px 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas:
    "topbar topbar"
    "sidebar main";
  height: 100vh;
}

.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-right: 6px;
}

.brand-mark {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  background: var(--accent);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  flex: 0 0 auto;
}

.brand-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  white-space: nowrap;
}

.topbar-spacer { flex: 1; }

.save-indicator {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--faint);
  white-space: nowrap;
  margin-right: 2px;
}

.mode-switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  background: var(--panel-alt);
  gap: 2px;
}

.mode-switch button {
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
}

.mode-switch button.is-active {
  background: var(--accent);
  color: #fff;
}

.tbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  padding: 7px 12px;
  border-radius: var(--radius);
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
}

.tbtn:hover { border-color: var(--line-strong); background: var(--panel-alt); }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbtn.primary:hover { background: var(--accent-ink); }
.tbtn.danger { color: var(--danger); border-color: var(--danger-soft); }
.tbtn.danger:hover { background: var(--danger-soft); }
.tbtn svg { width: 14px; height: 14px; stroke-width: 2; flex: 0 0 auto; }

/* ============ 사이드바 ============ */
.sidebar {
  grid-area: sidebar;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.platform-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--line);
}

.platform-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel-alt);
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
}

.platform-tab .dot {
  width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto;
}

.platform-tab.is-active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

.platform-tab-add {
  border: 1px dashed var(--line-strong);
  background: transparent;
  color: var(--faint);
  border-radius: 999px;
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
}

.sidebar-section {
  padding: 14px;
  border-bottom: 1px solid var(--line);
}

.sidebar-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.sidebar-section-title {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}

.icon-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  width: 24px; height: 24px;
  border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--panel-alt); color: var(--ink); }
.icon-btn svg { width: 15px; height: 15px; stroke-width: 2; }

.scenario-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 9px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
}

.scenario-item:hover { background: var(--panel-alt); }
.scenario-item.is-active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }

.scenario-item-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tree {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.tree-empty {
  color: var(--faint);
  font-size: 12.5px;
  text-align: center;
  padding: 30px 10px;
  line-height: 1.7;
}

.part-block { margin-bottom: 4px; }

.part-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  font-size: 12.5px;
  color: var(--ink);
}

.part-head:hover { background: var(--panel-alt); }

.part-head .chev {
  width: 12px; height: 12px; flex: 0 0 auto;
  color: var(--faint);
  transition: transform .15s ease;
}
.part-block.is-open .part-head .chev { transform: rotate(90deg); }

.part-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }

.part-actions { display: none; gap: 2px; }
.part-head:hover .part-actions { display: flex; }

.scene-list {
  display: none;
  padding-left: 20px;
  margin: 2px 0 6px;
  border-left: 1px solid var(--line);
}
.part-block.is-open .scene-list { display: block; }

.scene-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 8px;
  margin-left: 4px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12.5px;
  color: var(--muted);
}
.scene-item:hover { background: var(--panel-alt); color: var(--ink); }
.scene-item.is-active { background: var(--ink); color: #fff; }
.scene-item.is-done .scene-item-title { text-decoration: line-through; opacity: 0.6; }

.scene-done-check {
  flex: 0 0 auto;
  margin: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

.scene-actions { display: none; gap: 1px; flex: 0 0 auto; }
.scene-item:hover .scene-actions { display: flex; }
.scene-actions .icon-btn { width: 20px; height: 20px; color: inherit; font-size: 11px; }
.scene-actions .icon-btn svg { width: 13px; height: 13px; }

.part-actions .icon-btn { font-size: 11px; }
.part-actions .icon-btn:disabled,
.scene-actions .icon-btn:disabled { opacity: 0.3; cursor: default; }
.part-actions .icon-btn:disabled:hover,
.scene-actions .icon-btn:disabled:hover { background: transparent; }

.scene-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.add-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  margin-left: 24px;
  color: var(--faint);
  font-size: 12px;
  border-radius: var(--radius);
  cursor: pointer;
}
.add-row:hover { background: var(--panel-alt); color: var(--accent-ink); }
.add-row svg { width: 12px; height: 12px; }

.add-scenario-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 8px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  margin-top: 4px;
}
.add-scenario-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }

/* ============ 메인 ============ */
.main {
  grid-area: main;
  overflow-y: auto;
  padding: 32px 40px 80px;
}

.main-empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  color: var(--faint);
  text-align: center;
}
.main-empty svg { width: 40px; height: 40px; opacity: .5; margin-bottom: 6px; }
.main-empty h3 { font-family: var(--font-display); font-size: 20px; color: var(--muted); margin: 0; }
.main-empty p { font-size: 13px; max-width: 320px; margin: 0; }

.scene-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}

.breadcrumb {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--faint);
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

.scene-title-input {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 600;
  color: var(--ink);
  border: none;
  background: transparent;
  padding: 0;
  width: 100%;
  outline: none;
}
.scene-title-input:focus { color: var(--accent-ink); }

.scene-play-title {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 600;
  color: var(--ink);
  margin: 0;
}

.scene-header-actions {
  display: flex;
  gap: 8px;
  flex: 0 0 auto;
  padding-top: 4px;
}

.field-block { margin-bottom: 26px; transition: opacity .15s ease; }
.field-block.is-dragging { opacity: 0.35; }
.field-block.is-drag-over { box-shadow: 0 -2px 0 var(--accent); }

.drag-handle {
  cursor: grab;
  color: var(--faint);
  font-size: 13px;
  line-height: 1;
  padding: 2px 2px;
  flex: 0 0 auto;
  user-select: none;
}
.drag-handle:active { cursor: grabbing; }

.field-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.field-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  flex: 1;
  min-width: 0;
}
.field-label .swatch { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }

.block-label-input {
  border: none;
  background: transparent;
  font: inherit;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 4px;
  border-radius: 4px;
  min-width: 0;
  flex: 1;
}
.block-label-input:hover { background: var(--panel-alt); }
.block-label-input:focus { outline: none; background: var(--panel-alt); color: var(--ink); }

.block-controls {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 0 0 auto;
}
.block-controls .icon-btn { font-size: 12px; font-weight: 700; color: var(--faint); }
.block-controls .icon-btn:disabled { opacity: 0.3; cursor: default; }
.block-controls .icon-btn:disabled:hover { background: transparent; }

.add-block-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 6px;
  padding-top: 20px;
  border-top: 1px dashed var(--line);
}
.add-block-btn { min-width: 150px; }

@media (max-width: 640px) {
  .add-block-bar { flex-direction: column; }
}

.field-textarea {
  width: 100%;
  min-height: 140px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 14px;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--ink);
  resize: none;
  overflow: hidden;
  outline: none;
}
.field-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.field-play-box {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-alt);
  padding: 16px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--ink);
  position: relative;
}
.field-play-box:empty::before,
.field-play-box.is-empty::before {
  content: "(내용 없음)";
  color: var(--faint);
}

.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.copy-btn svg { width: 11px; height: 11px; }
.copy-btn.is-copied { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }

.keeper-box .field-textarea,
.keeper-box .field-play-box {
  background: var(--gold-soft);
  border-color: rgba(169, 122, 58, 0.28);
}

.truth-box .field-textarea,
.truth-box .field-play-box,
.truth-box.field-block .field-play-box {
  background: rgba(92, 47, 61, 0.07);
  border-color: rgba(92, 47, 61, 0.3);
}
.truth-box .field-label { color: #5c2f3d; }

/* 명령어 삽입 바 */
.command-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.command-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel-alt);
  color: var(--muted);
  padding: 4px 10px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.command-chip:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.command-chip-manage {
  border: 1px dashed var(--line-strong);
  color: var(--faint);
  background: transparent;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
}
.command-chip-manage:hover { color: var(--accent-ink); border-color: var(--accent); }

/* 분기 / 판정 카드 */
.item-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 14px;
  margin-bottom: 10px;
}
.item-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.item-card-head input.mini-input {
  flex: 1;
  border: none;
  border-bottom: 1px dashed var(--line-strong);
  background: transparent;
  font-weight: 700;
  font-size: 13px;
  padding: 2px 0;
  outline: none;
  color: var(--ink);
}
.item-card-head input.mini-input:focus { border-color: var(--accent); }

.remove-btn {
  border: none;
  background: transparent;
  color: var(--faint);
  width: 22px; height: 22px;
  border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
}
.remove-btn:hover { background: var(--danger-soft); color: var(--danger); }
.remove-btn svg { width: 14px; height: 14px; }

.outcome-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
@media (max-width: 720px) { .outcome-grid { grid-template-columns: 1fr; } }

.outcome-field { display: flex; flex-direction: column; gap: 5px; }
.outcome-label {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
  padding: 2px 0;
}
.outcome-label.crit-success { color: var(--gold); }
.outcome-label.success { color: var(--accent); }
.outcome-label.fail { color: var(--muted); }
.outcome-label.crit-fail { color: var(--danger); }
.outcome-field textarea {
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 8px 9px;
  font-size: 12.5px;
  min-height: 60px;
  resize: none;
  overflow: hidden;
  outline: none;
}
.outcome-field.crit-success textarea { background: var(--gold-soft); }
.outcome-field.success textarea { background: var(--accent-soft); }
.outcome-field.fail textarea { background: var(--panel-alt); }
.outcome-field.crit-fail textarea { background: var(--danger-soft); }
.outcome-field textarea:focus { border-color: var(--accent); }

.add-item-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px dashed var(--line-strong);
  background: transparent;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: var(--radius);
  font-size: 12.5px;
  font-weight: 600;
  width: 100%;
  justify-content: center;
}
.add-item-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.add-item-btn svg { width: 13px; height: 13px; }

/* 플레이 모드 - 분기/판정 카드 */
.play-item-card {
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--panel);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.play-item-title {
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.play-item-body { font-size: 13px; line-height: 1.7; white-space: pre-wrap; color: var(--ink); }

.play-outcome-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 0;
  border-top: 1px dashed var(--line);
  font-size: 12.5px;
}
.play-outcome-row:first-child { border-top: none; }
.play-outcome-row .copy-btn { flex: 0 0 auto; }
.play-outcome-tag {
  flex: 0 0 68px;
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  padding-top: 1px;
}
.play-outcome-tag.crit-success { color: var(--gold); }
.play-outcome-tag.success { color: var(--accent); }
.play-outcome-tag.fail { color: var(--muted); }
.play-outcome-tag.crit-fail { color: var(--danger); }
.play-outcome-text { flex: 1; white-space: pre-wrap; color: var(--ink); }

/* NPC 카드 - 편집 */
.npc-form { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--panel); }
.npc-form-row { display: flex; gap: 12px; margin-bottom: 12px; }
.npc-avatar-edit {
  width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex: 0 0 auto;
  background: var(--panel-alt); border: 1px solid var(--line);
}
.npc-avatar-edit img { width: 100%; height: 100%; object-fit: cover; }
.npc-form-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.npc-form-fields input {
  border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; font-size: 12.5px; outline: none;
}
.npc-form-fields input:focus { border-color: var(--accent); }
.npc-sub-label { display: block; font-size: 10.5px; font-weight: 700; color: var(--faint); letter-spacing: 0.04em; margin: 10px 0 5px; }
.npc-form textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px;
  font-size: 12.5px; min-height: 56px; resize: none; overflow: hidden; outline: none;
}
.npc-form textarea:focus { border-color: var(--accent); }

/* NPC 카드 - 플레이 */
.npc-play-card { border: 1px solid var(--line); border-left: 3px solid #7a5c8a; border-radius: 0 var(--radius) var(--radius) 0; background: var(--panel); padding: 14px; }
.npc-play-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.npc-play-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; border: 1px solid var(--line); }
.npc-play-avatar-empty { background: var(--panel-alt); }
.npc-play-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); }
.npc-play-role { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.npc-play-traits { margin: 0 0 10px; padding-left: 18px; font-size: 12.5px; color: var(--ink); line-height: 1.7; }
.npc-play-line {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: 7px 0; border-top: 1px dashed var(--line); font-size: 13px; font-style: italic; color: var(--ink);
}
.npc-play-line:first-of-type { border-top: none; }
.npc-play-line .copy-btn { flex: 0 0 auto; }

/* 핸드아웃 - 편집 */
textarea.handout-gmnote { background: var(--gold-soft); border-color: rgba(169, 122, 58, 0.28); }

/* 핸드아웃 - 플레이 */
.handout-play-card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.handout-play-title {
  padding: 12px 16px 0; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink);
}
.handout-play-content { padding: 14px 16px; white-space: pre-wrap; font-size: 13.5px; line-height: 1.8; color: var(--ink); }
.handout-gmnote-play {
  margin-top: 8px; border: 1px solid rgba(169, 122, 58, 0.28); background: var(--gold-soft);
  border-radius: var(--radius); padding: 10px 12px; font-size: 12.5px; color: var(--ink); white-space: pre-wrap; line-height: 1.6;
}
.handout-gmnote-tag {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 1px 8px; margin-right: 8px; vertical-align: 1px;
}

/* BGM - 플레이 */
.bgm-play-card { border: 1px solid var(--line); border-left: 3px solid #9c4f6b; border-radius: 0 var(--radius) var(--radius) 0; background: var(--panel); padding: 12px 14px; }
.bgm-play-head { display: flex; align-items: center; gap: 8px; }
.bgm-play-note-icon { color: #9c4f6b; font-size: 15px; flex: 0 0 auto; }
.bgm-play-title { flex: 1; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink); }
.bgm-yt-wrap { position: relative; padding-top: 56.25%; margin-top: 10px; border-radius: 5px; overflow: hidden; background: #000; }
.bgm-yt-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.bgm-play-note { margin-top: 8px; font-size: 12px; color: var(--muted); white-space: pre-wrap; line-height: 1.6; }

/* 이전 / 다음 씬 네비게이션 */
.scene-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}
.scene-nav-btn {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 10px 14px;
  text-align: left;
}
.scene-nav-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.scene-nav-next { text-align: right; align-items: flex-end; }
.scene-nav-dir { font-size: 10.5px; font-weight: 700; color: var(--faint); letter-spacing: 0.03em; }
.scene-nav-title { font-family: var(--font-display); font-size: 14px; color: var(--ink); font-weight: 600; }

@media (max-width: 640px) {
  .scene-nav { grid-template-columns: 1fr; }
}

/* ============ 모달 ============ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(20, 26, 20, 0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 24px;
}
.modal-backdrop[hidden] { display: none; }

.modal {

}

.modal-head {

.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot {

}

.form-row { margin-bottom: 14px; }
.form-row label {

}
.form-row input[type=text], .form-row textarea, .form-row input[type=search] {

  border-radius: 5px;
  padding: 9px 11px;
  outline: none;
}
.form-row input:focus, .form-row textarea:focus { border-color: var(--accent); }

.command-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px;
  margin-bottom: 8px;
}
.command-row input { flex: 1; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-size: 12.5px; }
.command-row input.snippet { font-family: var(--font-mono); }

.color-quickadd {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  background: var(--panel-alt);
}
.color-quickadd-row { display: flex; gap: 8px; align-items: center; }
.color-quickadd-row input[type="color"] {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
  background: var(--panel);
}
.color-quickadd-hex {
  flex: 0 0 90px;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 8px 9px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  text-transform: uppercase;
}
.color-quickadd-row input[type="text"]:not(.color-quickadd-hex) {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 8px 9px;
  font-size: 12.5px;
}

.palette-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 2px;
  border-bottom: 1px solid var(--line);
}
.palette-row:first-child { padding-top: 0; }
.palette-swatch {
  width: 22px; height: 22px; border-radius: 5px; flex: 0 0 auto;
  border: 1px solid rgba(0,0,0,0.12);
}
.palette-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-hex { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); flex: 0 0 auto; }

.color-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
}
.color-swatch.is-selected { border-color: var(--ink); }

.replace-preview {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  background: var(--panel-alt);
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 14px;
}
.replace-preview b { color: var(--accent-ink); }

.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--ink);
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  z-index: 200;
}
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
  .sidebar { position: fixed; inset: 56px 0 0 0; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .sidebar.is-open { transform: translateX(0); }
  .main { padding: 20px 16px 60px; }
}
</style>
</head>

    return m ? m[1] : null;

                    ] },
                    { id: uid(), type: 'checks', label: '주사위 판정 결과', items: [
                      { id: uid(), name: '감정(Spot Hidden)', critSuccess: '문 틈으로 안쪽 서가가 살짝 보인다. 낡은 항해일지 하나가 눈에 띈다.', success: '문이 오랫동안 열리지 않았다는 걸 알 수 있다.', fail: '별다른 특이사항을 발견하지 못한다.', critFail: '문에 손이 걸려 가벼운 상처를 입는다(1 피해).' }
                    ] }
                  ]
                }
              ]
            }
          ]
        }
      ],
      selection: { platformId: roll20Id, scenarioId: null, partId: null, sceneId: null }
    };
  }

  var state = {
    data: loadData(),
    mode: 'edit',
    currentPlatformId: null,
    currentScenarioId: null,
    currentPartId: null,
    currentSceneId: null,
    openParts: {}
  };

  function loadData() {
    var d;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      d = raw ? JSON.parse(raw) : defaultData();
    } catch (e) {
      d = defaultData();
    }
    migrateData(d);
    return d;
  }

  // 예전 버전(본문/키퍼메모/분기/판정 고정 필드)으로 저장된 씬을
  // 자유 순서 블록(blocks) 구조로 자동 변환합니다.
  function migrateData(d) {
    (d.scenarios || []).forEach(function (scenario) {
      (scenario.parts || []).forEach(function (part) {
        (part.scenes || []).forEach(function (scene) {
          if (Array.isArray(scene.blocks)) return;
          var blocks = [];
          if (scene.content) blocks.push({ id: uid(), type: 'text', label: '본문 / 지문', content: scene.content });
          if (scene.keeperMemo) blocks.push({ id: uid(), type: 'memo', label: '키퍼 메모', content: scene.keeperMemo });
          if (scene.branches && scene.branches.length) blocks.push({ id: uid(), type: 'branches', label: '선택지에 따른 분기', items: scene.branches });
          if (scene.checks && scene.checks.length) blocks.push({ id: uid(), type: 'checks', label: '주사위 판정 결과', items: scene.checks });
          if (!blocks.length) blocks.push({ id: uid(), type: 'text', label: '본문 / 지문', content: '' });
          scene.blocks = blocks;
          delete scene.content;
          delete scene.keeperMemo;
          delete scene.branches;
          delete scene.checks;
        });
      });
    });
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      updateSaveIndicator();
    } catch (e) {
      showToast('저장 실패: 브라우저 저장공간을 확인해주세요');
    }
  }

  function updateSaveIndicator() {
    var el = document.getElementById('save-indicator');
    if (!el) return;
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var ss = String(now.getSeconds()).padStart(2, '0');
    el.textContent = '저장됨 ' + hh + ':' + mm + ':' + ss;
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('is-visible');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function () { t.classList.remove('is-visible'); }, 1800);
  }

  /* ---------- 데이터 조회 헬퍼 ---------- */
  function getPlatform(id) { return state.data.platforms.find(function (p) { return p.id === id; }); }
  function getScenario(id) { return state.data.scenarios.find(function (s) { return s.id === id; }); }
  function getScenariosForPlatform(platformId) {
    return state.data.scenarios.filter(function (s) { return s.platformId === platformId; });
  }
  function getPart(scenario, partId) {
    return scenario && scenario.parts.find(function (p) { return p.id === partId; });
  }
  function getScene(scenario, part, sceneId) {
    return part && part.scenes.find(function (sc) { return sc.id === sceneId; });
  }
  function getCurrentScenario() { return getScenario(state.currentScenarioId); }
  function getCurrentPart() {
    var sc = getCurrentScenario();
    return sc && getPart(sc, state.currentPartId);
  }
  function getCurrentScene() {
    var part = getCurrentPart();
    return part && getScene(getCurrentScenario(), part, state.currentSceneId);
  }

  /* ---------- 초기 선택 ---------- */
  function ensureSelection() {
    if (!state.currentPlatformId && state.data.platforms.length) {
      state.currentPlatformId = state.data.platforms[0].id;
    }
  }

  function moveInArray(arr, id, dir) {
    var i = arr.findIndex(function (item) { return item.id === id; });
    var j = i + dir;
    if (i === -1 || j < 0 || j >= arr.length) return;
    var tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }

  // 현재 시나리오의 모든 씬을 파트 순서 -> 씬 순서로 평평하게 나열
  function getFlatSceneList(scenario) {
    var flat = [];
    scenario.parts.forEach(function (part) {
      part.scenes.forEach(function (scene) {
        flat.push({ partId: part.id, sceneId: scene.id, partTitle: part.title, sceneTitle: scene.title });
      });
    });
    return flat;
  }

  /* ================= 렌더링 ================= */

  function render() {
    renderPlatformTabs();
    renderScenarioList();
    renderTree();
    renderMain();
  }

  function renderPlatformTabs() {
    var wrap = document.getElementById('platform-tabs');
    var html = '';
    state.data.platforms.forEach(function (p) {
      var active = p.id === state.currentPlatformId;
      html += '<button class="platform-tab' + (active ? ' is-active' : '') + '" data-platform="' + p.id + '">' +
        '<span class="dot" style="background:' + p.color + '"></span>' + escapeHtml(p.name) + '</button>';
    });
    html += '<button class="platform-tab-add" id="platform-add-btn" title="사이트 추가">' + ICONS.plus + '</button>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-platform]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.currentPlatformId = btn.getAttribute('data-platform');
        state.currentScenarioId = null;
        state.currentPartId = null;
        state.currentSceneId = null;
        render();
      });
    });
    document.getElementById('platform-add-btn').addEventListener('click', openPlatformModal);
  }

  function renderScenarioList() {
    var wrap = document.getElementById('scenario-list');
    var list = getScenariosForPlatform(state.currentPlatformId);
    if (!list.length) {
      wrap.innerHTML = '<div class="tree-empty" style="padding:14px 4px;">이 사이트로 진행하는<br>시나리오가 아직 없어요.</div>';
      return;
    }
    var html = '';
    list.forEach(function (s) {
      var active = s.id === state.currentScenarioId;
      html += '<div class="scenario-item' + (active ? ' is-active' : '') + '" data-scenario="' + s.id + '">' +
        '<span class="scenario-item-title">' + escapeHtml(s.title) + '</span>' +
        '<button class="icon-btn scenario-del" data-scenario-del="' + s.id + '" title="삭제">' + ICONS.trash + '</button>' +
        '</div>';
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-scenario]').forEach(function (el) {
      el.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-scenario-del]')) return;
        state.currentScenarioId = el.getAttribute('data-scenario');
        state.currentPartId = null;
        state.currentSceneId = null;
        render();
      });
    });
    wrap.querySelectorAll('[data-scenario-del]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var id = btn.getAttribute('data-scenario-del');
        var sc = getScenario(id);
        if (!sc) return;
        if (!confirm('"' + sc.title + '" 시나리오를 삭제할까요? 안의 모든 파트·씬이 함께 삭제됩니다.')) return;
        state.data.scenarios = state.data.scenarios.filter(function (s) { return s.id !== id; });
        if (state.currentScenarioId === id) {
          state.currentScenarioId = null;
          state.currentPartId = null;
          state.currentSceneId = null;
        }
        saveData();
        render();
      });
    });
  }

  function renderTree() {
    var wrap = document.getElementById('tree');
    var scenario = getCurrentScenario();
    if (!scenario) {
      wrap.innerHTML = '<div class="tree-empty">왼쪽에서 시나리오를<br>먼저 선택하거나 만들어주세요.</div>';
      return;
    }
    var html = '';
    scenario.parts.forEach(function (part, partIdx) {
      var isOpen = !!state.openParts[part.id];
      var doneCount = part.scenes.filter(function (s) { return s.done; }).length;
      html += '<div class="part-block' + (isOpen ? ' is-open' : '') + '" data-part="' + part.id + '">';
      html += '<div class="part-head" data-part-toggle="' + part.id + '">';
      html += '<span class="chev">' + ICONS.chev + '</span>';
      html += '<span class="part-title">' + escapeHtml(part.title) + '</span>';
      html += '<span class="part-count">' + doneCount + '/' + part.scenes.length + '</span>';
      html += '<span class="part-actions">' +
        '<button class="icon-btn" data-part-up="' + part.id + '" title="위로" ' + (partIdx === 0 ? 'disabled' : '') + '>↑</button>' +
        '<button class="icon-btn" data-part-down="' + part.id + '" title="아래로" ' + (partIdx === scenario.parts.length - 1 ? 'disabled' : '') + '>↓</button>' +
        '<button class="icon-btn" data-part-rename="' + part.id + '" title="이름 변경">✎</button>' +
        '<button class="icon-btn" data-part-del="' + part.id + '" title="삭제">' + ICONS.trash + '</button>' +
        '</span>';
      html += '</div>';

      html += '<div class="scene-list">';
      part.scenes.forEach(function (scene, sceneIdx) {
        var active = scene.id === state.currentSceneId && part.id === state.currentPartId;
        html += '<div class="scene-item' + (active ? ' is-active' : '') + (scene.done ? ' is-done' : '') + '" data-scene="' + scene.id + '" data-scene-part="' + part.id + '">' +
          '<input type="checkbox" class="scene-done-check" data-scene-done="' + scene.id + '" data-scene-done-part="' + part.id + '" ' + (scene.done ? 'checked' : '') + ' title="진행 완료 표시">' +
          '<span class="scene-item-title">' + escapeHtml(scene.title) + '</span>' +
          '<span class="scene-actions">' +
          '<button class="icon-btn" data-scene-up="' + scene.id + '" data-scene-up-part="' + part.id + '" title="위로" ' + (sceneIdx === 0 ? 'disabled' : '') + '>↑</button>' +
          '<button class="icon-btn" data-scene-down="' + scene.id + '" data-scene-down-part="' + part.id + '" title="아래로" ' + (sceneIdx === part.scenes.length - 1 ? 'disabled' : '') + '>↓</button>' +
          '<button class="icon-btn scene-del" data-scene-del="' + scene.id + '" data-scene-del-part="' + part.id + '" title="삭제">' + ICONS.trash + '</button>' +
          '</span>' +
          '</div>';
      });
      html += '<div class="add-row" data-add-scene="' + part.id + '">' + ICONS.plus + ' 새 씬</div>';
      html += '</div>'; // scene-list
      html += '</div>'; // part-block
    });
    html += '<div class="add-row" data-add-part style="margin-left:8px; margin-top:4px;">' + ICONS.plus + ' 새 파트(폴더)</div>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-part-toggle]').forEach(function (el) {
      el.addEventListener('click', function (ev) {
        if (ev.target.closest('.part-actions')) return;
        var id = el.getAttribute('data-part-toggle');
        state.openParts[id] = !state.openParts[id];
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-part-rename]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var id = btn.getAttribute('data-part-rename');
        var part = getPart(scenario, id);
        openPrompt('파트 이름 변경', part.title, function (val) {
          if (!val) return;
          part.title = val;
          saveData();
          renderTree();
        });
      });
    });
    wrap.querySelectorAll('[data-part-del]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var id = btn.getAttribute('data-part-del');
        var part = getPart(scenario, id);
        if (!confirm('"' + part.title + '" 파트를 삭제할까요? 안의 씬도 함께 삭제됩니다.')) return;
        scenario.parts = scenario.parts.filter(function (p) { return p.id !== id; });
        if (state.currentPartId === id) { state.currentPartId = null; state.currentSceneId = null; }
        saveData();
        render();
      });
    });
    wrap.querySelectorAll('[data-part-up]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        moveInArray(scenario.parts, btn.getAttribute('data-part-up'), -1);
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-part-down]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        moveInArray(scenario.parts, btn.getAttribute('data-part-down'), 1);
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-scene]').forEach(function (el) {
      el.addEventListener('click', function (ev) {
        if (ev.target.closest('.scene-actions') || ev.target.closest('.scene-done-check')) return;
        state.currentPartId = el.getAttribute('data-scene-part');
        state.currentSceneId = el.getAttribute('data-scene');
        renderTree();
        renderMain();
      });
    });
    wrap.querySelectorAll('[data-scene-done]').forEach(function (checkbox) {
      checkbox.addEventListener('click', function (ev) { ev.stopPropagation(); });
      checkbox.addEventListener('change', function () {
        var partId = checkbox.getAttribute('data-scene-done-part');
        var part = getPart(scenario, partId);
        var scene = getScene(scenario, part, checkbox.getAttribute('data-scene-done'));
        scene.done = checkbox.checked;
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-scene-del]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var sceneId = btn.getAttribute('data-scene-del');
        var partId = btn.getAttribute('data-scene-del-part');
        var part = getPart(scenario, partId);
        var scene = getScene(scenario, part, sceneId);
        if (!confirm('"' + scene.title + '" 씬을 삭제할까요?')) return;
        part.scenes = part.scenes.filter(function (s) { return s.id !== sceneId; });
        if (state.currentSceneId === sceneId) state.currentSceneId = null;
        saveData();
        render();
      });
    });
    wrap.querySelectorAll('[data-scene-up]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var part = getPart(scenario, btn.getAttribute('data-scene-up-part'));
        moveInArray(part.scenes, btn.getAttribute('data-scene-up'), -1);
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-scene-down]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var part = getPart(scenario, btn.getAttribute('data-scene-down-part'));
        moveInArray(part.scenes, btn.getAttribute('data-scene-down'), 1);
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-add-scene]').forEach(function (el) {
      el.addEventListener('click', function () {
        var partId = el.getAttribute('data-add-scene');
        var part = getPart(scenario, partId);
        openPrompt('새 씬 이름', '', function (val) {
          if (!val) return;
          var scene = { id: uid(), title: val, blocks: [
            { id: uid(), type: 'text', label: '본문 / 지문', content: '' }
          ] };
          part.scenes.push(scene);
          state.openParts[partId] = true;
          state.currentPartId = partId;
          state.currentSceneId = scene.id;
          saveData();
          render();
        });
      });
    });
    var addPartEl = wrap.querySelector('[data-add-part]');
    if (addPartEl) {
      addPartEl.addEventListener('click', function () {
        openPrompt('새 파트(폴더) 이름', '', function (val) {
          if (!val) return;
          var part = { id: uid(), title: val, scenes: [] };
          scenario.parts.push(part);
          state.openParts[part.id] = true;
          saveData();
          renderTree();
        });
      });
    }
  }

  /* ---------- 메인 패널 ---------- */

  function renderMain() {
    var main = document.getElementById('main');
    var scene = getCurrentScene();
    if (!scene) {
      main.innerHTML = '<div class="main-empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V4a2 2 0 00-2-2H6.5A2.5 2.5 0 004 4.5v15z" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<h3>씬을 선택해주세요</h3>' +
        '<p>왼쪽에서 시나리오와 파트를 고르고, 씬을 선택하거나 새로 만들면 여기에 내용이 나타나요.</p>' +
        '</div>';
      return;
    }
    if (state.mode === 'edit') renderEditMode(main, scene);
    else renderPlayMode(main, scene);
  }

  function currentPlatform() {
    var sc = getCurrentScenario();
    return sc && getPlatform(sc.platformId);
  }

  var BLOCK_TYPES = {
    truth: { label: '진상', color: '#5c2f3d' },
    text: { label: '본문 텍스트', color: 'var(--accent)' },
    memo: { label: '키퍼 메모', color: 'var(--gold)' },
    lines: { label: '대사', color: '#2f5f8a' },
    branches: { label: '선택지 분기', color: '#4a5a8a' },
    checks: { label: '판정 결과', color: 'var(--danger)' },
    npc: { label: 'NPC 카드', color: '#7a5c8a' },
    handout: { label: '핸드아웃', color: '#2f7d8a' },
    bgm: { label: 'BGM', color: '#9c4f6b' }
  };

  function renderEditMode(main, scene) {
    var scenario = getCurrentScenario();
    var part = getCurrentPart();
    var platform = currentPlatform();

    var html = '';
    html += '<div class="scene-header">';
    html += '<div style="flex:1; min-width:0;">';
    html += '<div class="breadcrumb">' + escapeHtml(platform ? platform.name : '') + ' / ' + escapeHtml(scenario.title) + ' / ' + escapeHtml(part.title) + '</div>';
    html += '<input type="text" class="scene-title-input" id="scene-title-input" value="' + escapeHtml(scene.title) + '">';
    html += '</div>';
    html += '</div>';

    html += '<div id="block-list"></div>';
    html += '<div class="add-block-bar">';
    Object.keys(BLOCK_TYPES).forEach(function (type) {
      html += '<button class="add-item-btn add-block-btn" data-add-block="' + type + '" style="width:auto; flex:1;">' + ICONS.plus + ' ' + BLOCK_TYPES[type].label + '</button>';
    });
    html += '</div>';

    main.innerHTML = html;

    document.getElementById('scene-title-input').addEventListener('input', function (e) {
      scene.title = e.target.value;
      saveData();
      renderTree();
    });

    main.querySelectorAll('[data-add-block]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var type = btn.getAttribute('data-add-block');
        var block = { id: uid(), type: type, label: BLOCK_TYPES[type].label };
        if (type === 'text' || type === 'memo' || type === 'truth') block.content = '';
        if (type === 'branches' || type === 'checks' || type === 'lines') block.items = [];
        if (type === 'npc') { block.name = ''; block.imageUrl = ''; block.role = ''; block.traits = ''; block.lines = ''; }
        if (type === 'handout') { block.title = ''; block.content = ''; block.gmNote = ''; }
        if (type === 'bgm') { block.title = ''; block.url = ''; block.note = ''; }
        scene.blocks.push(block);
        saveData();
        renderBlockList(scene, platform);
      });
    });

    renderBlockList(scene, platform);
  }

  function moveBlock(scene, blockId, dir) {
    var i = scene.blocks.findIndex(function (b) { return b.id === blockId; });
    var j = i + dir;
    if (i === -1 || j < 0 || j >= scene.blocks.length) return;
    var tmp = scene.blocks[i];
    scene.blocks[i] = scene.blocks[j];
    scene.blocks[j] = tmp;
    saveData();
  }

  function renderBlockList(scene, platform) {
    var wrap = document.getElementById('block-list');
    var html = '';
    scene.blocks.forEach(function (block, idx) {
      var meta = BLOCK_TYPES[block.type] || BLOCK_TYPES.text;
      html += '<div class="field-block" data-block="' + block.id + '" draggable="true">';
      html += '<div class="field-label-row">';
      html += '<span class="drag-handle" title="드래그해서 순서 바꾸기">⠿</span>';
      html += '<span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>';
      html += '<input class="block-label-input" data-block-label="' + block.id + '" value="' + escapeHtml(block.label) + '"></span>';
      html += '<span class="block-controls">';
      html += '<button class="icon-btn" data-block-up="' + block.id + '" title="위로" ' + (idx === 0 ? 'disabled' : '') + '>↑</button>';
      html += '<button class="icon-btn" data-block-down="' + block.id + '" title="아래로" ' + (idx === scene.blocks.length - 1 ? 'disabled' : '') + '>↓</button>';
      html += '<button class="icon-btn" data-block-del="' + block.id + '" title="블록 삭제">' + ICONS.trash + '</button>';
      html += '</span>';
      html += '</div>';

      if (block.type === 'text') {
        html += '<div class="command-bar" data-command-bar-for="' + block.id + '"></div>';
        html += '<textarea class="field-textarea" data-block-content="' + block.id + '" placeholder="여기에 장면 지문, 대사, 묘사를 적어주세요.">' + escapeHtml(block.content) + '</textarea>';
      } else if (block.type === 'memo') {
        html += '<div class="keeper-box"><textarea class="field-textarea" data-block-content="' + block.id + '" placeholder="진행 팁, GM만 알아야 할 정보, 유의사항 등을 적어주세요.">' + escapeHtml(block.content) + '</textarea></div>';
      } else if (block.type === 'truth') {
        html += '<div class="truth-box"><textarea class="field-textarea" data-block-content="' + block.id + '" placeholder="이 시나리오의 진짜 전말, 사건의 진상을 적어주세요. (GM 전용)">' + escapeHtml(block.content) + '</textarea></div>';
      } else if (block.type === 'branches') {
        html += '<div data-branch-wrap="' + block.id + '"></div>';
        html += '<button class="add-item-btn" data-add-branch="' + block.id + '">' + ICONS.plus + ' 분기 추가</button>';
      } else if (block.type === 'lines') {
        html += '<div data-line-wrap="' + block.id + '"></div>';
        html += '<button class="add-item-btn" data-add-line="' + block.id + '">' + ICONS.plus + ' 대사 추가</button>';
      } else if (block.type === 'checks') {
        html += '<div data-check-wrap="' + block.id + '"></div>';
        html += '<button class="add-item-btn" data-add-check="' + block.id + '">' + ICONS.plus + ' 판정 항목 추가</button>';
      } else if (block.type === 'npc') {
        html += '<div class="npc-form" data-npc-form="' + block.id + '">';
        html += '<div class="npc-form-row">';
        html += '<div class="npc-avatar-edit"><img data-npc-preview="' + block.id + '" src="' + escapeHtml(block.imageUrl) + '" onerror="this.style.display=\'none\'"></div>';
        html += '<div class="npc-form-fields">';
        html += '<input type="text" data-npc-name="' + block.id + '" placeholder="NPC 이름" value="' + escapeHtml(block.name) + '">';
        html += '<input type="text" data-npc-role="' + block.id + '" placeholder="역할 / 한 줄 소개 (예: 등대지기, 수상한 노인)" value="' + escapeHtml(block.role) + '">';
        html += '<input type="text" data-npc-image="' + block.id + '" placeholder="이미지 URL (선택)" value="' + escapeHtml(block.imageUrl) + '">';
        html += '</div></div>';
        html += '<label class="npc-sub-label">특징 (한 줄에 하나씩)</label>';
        html += '<textarea data-npc-traits="' + block.id + '" placeholder="예&#10;왼쪽 눈에 안대를 하고 있다&#10;말투가 유독 정중하다">' + escapeHtml(block.traits) + '</textarea>';
        html += '<label class="npc-sub-label">대사 예시 (한 줄에 하나씩)</label>';
        html += '<textarea data-npc-lines="' + block.id + '" placeholder="예&#10;&quot;등대엔 함부로 들어가지 않는 게 좋을 텐데.&quot;">' + escapeHtml(block.lines) + '</textarea>';
        html += '</div>';
      } else if (block.type === 'handout') {
        html += '<div class="npc-form" data-handout-form="' + block.id + '">';
        html += '<label class="npc-sub-label" style="margin-top:0;">핸드아웃 제목</label>';
        html += '<input type="text" data-handout-title="' + block.id + '" placeholder="예: 낡은 항해일지" value="' + escapeHtml(block.title) + '">';
        html += '<label class="npc-sub-label">내용</label>';
        html += '<textarea data-handout-content="' + block.id + '" placeholder="편지, 신문기사, 사진 설명 등 플레이어에게 그대로 보여줄 텍스트">' + escapeHtml(block.content) + '</textarea>';
        html += '<label class="npc-sub-label">GM 전용 메모</label>';
        html += '<textarea data-handout-gmnote="' + block.id + '" class="handout-gmnote" placeholder="이 핸드아웃과 관련해서 GM만 알아야 할 정보">' + escapeHtml(block.gmNote) + '</textarea>';
        html += '</div>';
      } else if (block.type === 'bgm') {
        html += '<div class="npc-form" data-bgm-form="' + block.id + '">';
        html += '<label class="npc-sub-label" style="margin-top:0;">트랙 이름</label>';
        html += '<input type="text" data-bgm-title="' + block.id + '" placeholder="예: 등대 진입 - 긴장감" value="' + escapeHtml(block.title) + '">';
        html += '<label class="npc-sub-label">링크 (유튜브 또는 음원 파일 URL)</label>';
        html += '<input type="text" data-bgm-url="' + block.id + '" placeholder="https://youtube.com/watch?v=... 또는 https://.../track.mp3" value="' + escapeHtml(block.url) + '">';
        html += '<label class="npc-sub-label">재생 메모 (타이밍, 볼륨 등)</label>';
        html += '<textarea data-bgm-note="' + block.id + '" placeholder="예: 문을 여는 순간부터 재생, 볼륨은 낮게">' + escapeHtml(block.note) + '</textarea>';
        html += '</div>';
      }

      html += '</div>';
    });
    if (!scene.blocks.length) {
      html = '<div class="tree-empty" style="text-align:left; padding:20px 0;">아직 블록이 없어요. 아래 버튼으로 원하는 순서대로 추가해보세요.</div>';
    }
    wrap.innerHTML = html;

    // 드래그앤드롭으로 블록 순서 변경
    var draggedId = null;
    wrap.querySelectorAll('.field-block[data-block]').forEach(function (el) {
      el.addEventListener('dragstart', function (e) {
        draggedId = el.getAttribute('data-block');
        el.classList.add('is-dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', draggedId);
        }
      });
      el.addEventListener('dragend', function () {
        el.classList.remove('is-dragging');
        wrap.querySelectorAll('.field-block').forEach(function (b) { b.classList.remove('is-drag-over'); });
      });
      el.addEventListener('dragover', function (e) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        if (draggedId && el.getAttribute('data-block') !== draggedId) el.classList.add('is-drag-over');
      });
      el.addEventListener('dragleave', function () {
        el.classList.remove('is-drag-over');
      });
      el.addEventListener('drop', function (e) {
        e.preventDefault();
        el.classList.remove('is-drag-over');
        var targetId = el.getAttribute('data-block');
        if (!draggedId || draggedId === targetId) return;
        var fromIdx = scene.blocks.findIndex(function (b) { return b.id === draggedId; });
        var toIdx = scene.blocks.findIndex(function (b) { return b.id === targetId; });
        if (fromIdx === -1 || toIdx === -1) return;
        var moved = scene.blocks.splice(fromIdx, 1)[0];
        scene.blocks.splice(toIdx, 0, moved);
        saveData();
        renderBlockList(scene, platform);
      });
    });

    // 라벨/이동/삭제
    wrap.querySelectorAll('[data-block-label]').forEach(function (input) {
      input.addEventListener('input', function () {
        findBlock(scene, input.getAttribute('data-block-label')).label = input.value;
        saveData();
      });
    });
    wrap.querySelectorAll('[data-block-up]').forEach(function (btn) {
      btn.addEventListener('click', function () { moveBlock(scene, btn.getAttribute('data-block-up'), -1); renderBlockList(scene, platform); });
    });
    wrap.querySelectorAll('[data-block-down]').forEach(function (btn) {
      btn.addEventListener('click', function () { moveBlock(scene, btn.getAttribute('data-block-down'), 1); renderBlockList(scene, platform); });
    });
    wrap.querySelectorAll('[data-block-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-block-del');
        if (!confirm('이 블록을 삭제할까요?')) return;
        scene.blocks = scene.blocks.filter(function (b) { return b.id !== id; });
        saveData();
        renderBlockList(scene, platform);
      });
    });

    // 텍스트/메모 입력
    wrap.querySelectorAll('[data-block-content]').forEach(function (ta) {
      ta.addEventListener('input', function () {
        findBlock(scene, ta.getAttribute('data-block-content')).content = ta.value;
        saveData();
      });
    });

    // NPC 카드 입력
    ['name', 'role', 'traits', 'lines'].forEach(function (key) {
      wrap.querySelectorAll('[data-npc-' + key + ']').forEach(function (input) {
        input.addEventListener('input', function () {
          findBlock(scene, input.getAttribute('data-npc-' + key))[key] = input.value;
          saveData();
        });
      });
    });
    wrap.querySelectorAll('[data-npc-image]').forEach(function (input) {
      input.addEventListener('input', function () {
        var block = findBlock(scene, input.getAttribute('data-npc-image'));
        block.imageUrl = input.value;
        saveData();
        var preview = wrap.querySelector('[data-npc-preview="' + block.id + '"]');
        if (preview) { preview.src = input.value; preview.style.display = ''; }
      });
    });

    // 핸드아웃 입력
    ['title', 'content', 'gmNote'].forEach(function (key) {
      wrap.querySelectorAll('[data-handout-' + (key === 'gmNote' ? 'gmnote' : key) + ']').forEach(function (input) {
        input.addEventListener('input', function () {
          findBlock(scene, input.getAttribute('data-handout-' + (key === 'gmNote' ? 'gmnote' : key)))[key] = input.value;
          saveData();
        });
      });
    });

    // BGM 입력
    ['title', 'url', 'note'].forEach(function (key) {
      wrap.querySelectorAll('[data-bgm-' + key + ']').forEach(function (input) {
        input.addEventListener('input', function () {
          findBlock(scene, input.getAttribute('data-bgm-' + key))[key] = input.value;
          saveData();
        });
      });
    });

    // 본문 블록에는 명령어 바를 붙여줌
    wrap.querySelectorAll('[data-command-bar-for]').forEach(function (bar) {
      var blockId = bar.getAttribute('data-command-bar-for');
      if (platform && platform.commands.length) {
        var cbHtml = '';
        platform.commands.forEach(function (c) {
          cbHtml += '<button class="command-chip" data-snippet="' + escapeHtml(c.snippet) + '" data-snippet-target="' + blockId + '">' + escapeHtml(c.label) + '</button>';
        });
        cbHtml += '<button class="command-chip-manage" data-manage-commands="' + blockId + '">+ 관리</button>';
        bar.innerHTML = cbHtml;
      } else {
        bar.innerHTML = '<button class="command-chip-manage" data-manage-commands="' + blockId + '">+ 이 사이트의 명령어 등록하기</button>';
      }
    });
    wrap.querySelectorAll('[data-snippet]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var ta = wrap.querySelector('[data-block-content="' + btn.getAttribute('data-snippet-target') + '"]');
        insertAtCursor(ta, btn.getAttribute('data-snippet'));
      });
    });
    wrap.querySelectorAll('[data-manage-commands]').forEach(function (btn) {
      btn.addEventListener('click', openCommandModal);
    });

    // 분기 / 판정 / 대사 블록
    scene.blocks.forEach(function (block) {
      if (block.type === 'branches') renderBranchList(scene, block);
      if (block.type === 'checks') renderCheckList(scene, block);
      if (block.type === 'lines') renderLineList(scene, block);
    });
    wrap.querySelectorAll('[data-add-branch]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var block = findBlock(scene, btn.getAttribute('data-add-branch'));
        block.items.push({ id: uid(), label: '', text: '' });
        saveData();
        renderBranchList(scene, block);
      });
    });
    wrap.querySelectorAll('[data-add-line]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var block = findBlock(scene, btn.getAttribute('data-add-line'));
        block.items.push({ id: uid(), label: '', text: '' });
        saveData();
        renderLineList(scene, block);
      });
    });
    wrap.querySelectorAll('[data-add-check]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var block = findBlock(scene, btn.getAttribute('data-add-check'));
        block.items.push({ id: uid(), name: '', critSuccess: '', success: '', fail: '', critFail: '' });
        saveData();
        renderCheckList(scene, block);
        autoResizeAllTextareas(wrap);
      });
    });

    autoResizeAllTextareas(wrap);
  }

  function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }

  function autoResizeAllTextareas(root) {
    (root || document).querySelectorAll('textarea').forEach(autoResizeTextarea);
  }

  function findBlock(scene, id) { return scene.blocks.find(function (b) { return b.id === id; }); }

  function renderBranchList(scene, block) {
    var wrap = document.querySelector('[data-branch-wrap="' + block.id + '"]');
    if (!wrap) return;
    var html = '';
    block.items.forEach(function (b) {
      html += '<div class="item-card" data-branch="' + b.id + '">';
      html += '<div class="item-card-head">';
      html += '<input class="mini-input" data-branch-label="' + b.id + '" placeholder="선택지 (예: 문을 두드린다)" value="' + escapeHtml(b.label) + '">';
      html += '<button class="remove-btn" data-branch-del="' + b.id + '">' + ICONS.trash + '</button>';
      html += '</div>';
      html += '<textarea data-branch-text="' + b.id + '" placeholder="이 선택지를 골랐을 때의 전개">' + escapeHtml(b.text) + '</textarea>';
      html += '</div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('textarea[data-branch-text]').forEach(function (t) {
      t.style.cssText = 'width:100%; border:1px solid var(--line); border-radius:5px; padding:8px 9px; font-size:12.5px; min-height:56px; resize:none; overflow:hidden; outline:none;';
    });

    wrap.querySelectorAll('[data-branch-label]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-branch-label')).label = input.value; saveData();
      });
    });
    wrap.querySelectorAll('[data-branch-text]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-branch-text')).text = input.value; saveData();
      });
    });
    wrap.querySelectorAll('[data-branch-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        block.items = block.items.filter(function (b) { return b.id !== btn.getAttribute('data-branch-del'); });
        saveData();
        renderBranchList(scene, block);
      });
    });
    autoResizeAllTextareas(wrap);
  }
  function findItem(block, id) { return block.items.find(function (i) { return i.id === id; }); }

  function renderLineList(scene, block) {
    var wrap = document.querySelector('[data-line-wrap="' + block.id + '"]');
    if (!wrap) return;
    var html = '';
    block.items.forEach(function (b) {
      html += '<div class="item-card" data-line="' + b.id + '">';
      html += '<div class="item-card-head">';
      html += '<input class="mini-input" data-line-label="' + b.id + '" placeholder="화자 (예: 등대지기, 나레이션 — 생략 가능)" value="' + escapeHtml(b.label) + '">';
      html += '<button class="remove-btn" data-line-del="' + b.id + '">' + ICONS.trash + '</button>';
      html += '</div>';
      html += '<textarea data-line-text="' + b.id + '" placeholder="반드시 전달해야 하는 대사 내용">' + escapeHtml(b.text) + '</textarea>';
      html += '</div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('textarea[data-line-text]').forEach(function (t) {
      t.style.cssText = 'width:100%; border:1px solid var(--line); border-radius:5px; padding:8px 9px; font-size:12.5px; min-height:56px; resize:none; overflow:hidden; outline:none;';
    });

    wrap.querySelectorAll('[data-line-label]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-line-label')).label = input.value; saveData();
      });
    });
    wrap.querySelectorAll('[data-line-text]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-line-text')).text = input.value; saveData();
      });
    });
    wrap.querySelectorAll('[data-line-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        block.items = block.items.filter(function (b) { return b.id !== btn.getAttribute('data-line-del'); });
        saveData();
        renderLineList(scene, block);
      });
    });
    autoResizeAllTextareas(wrap);
  }

  function renderCheckList(scene, block) {
    var wrap = document.querySelector('[data-check-wrap="' + block.id + '"]');
    if (!wrap) return;
    var html = '';
    block.items.forEach(function (c) {
      html += '<div class="item-card" data-check="' + c.id + '">';
      html += '<div class="item-card-head">';
      html += '<input class="mini-input" data-check-name="' + c.id + '" placeholder="판정명 (예: 감정, 도서관 이용, HP)" value="' + escapeHtml(c.name) + '">';
      html += '<button class="remove-btn" data-check-del="' + c.id + '">' + ICONS.trash + '</button>';
      html += '</div>';
      html += '<div class="outcome-grid">';
      html += outcomeField(c.id, 'critSuccess', 'crit-success', '대성공', c.critSuccess);
      html += outcomeField(c.id, 'success', 'success', '성공', c.success);
      html += outcomeField(c.id, 'fail', 'fail', '실패', c.fail);
      html += outcomeField(c.id, 'critFail', 'crit-fail', '대실패', c.critFail);
      html += '</div>';
      html += '</div>';
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-check-name]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-check-name')).name = input.value; saveData();
      });
    });
    ['critSuccess', 'success', 'fail', 'critFail'].forEach(function (key) {
      wrap.querySelectorAll('[data-check-' + key + ']').forEach(function (input) {
        input.addEventListener('input', function () {
          findItem(block, input.getAttribute('data-check-' + key))[key] = input.value; saveData();
        });
      });
    });
    wrap.querySelectorAll('[data-check-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        block.items = block.items.filter(function (c) { return c.id !== btn.getAttribute('data-check-del'); });
        saveData();
        renderCheckList(scene, block);
      });
    });
    autoResizeAllTextareas(wrap);
  }

  function outcomeField(checkId, key, cls, label, value) {
    return '<div class="outcome-field ' + cls + '">' +
      '<span class="outcome-label ' + cls + '">' + label + '</span>' +
      '<textarea data-check-' + key + '="' + checkId + '">' + escapeHtml(value) + '</textarea>' +
      '</div>';
  }

  /* ---------- 플레이 모드 ---------- */

  function renderPlayMode(main, scene) {
    var scenario = getCurrentScenario();
    var part = getCurrentPart();
    var platform = currentPlatform();

    var html = '';
    html += '<div class="scene-header">';
    html += '<div style="flex:1; min-width:0;">';
    html += '<div class="breadcrumb">' + escapeHtml(platform ? platform.name : '') + ' / ' + escapeHtml(scenario.title) + ' / ' + escapeHtml(part.title) + '</div>';
    html += '<h1 class="scene-play-title">' + escapeHtml(scene.title) + '</h1>';
    html += '</div>';
    html += '<div class="scene-header-actions"><button class="copy-btn" data-copy-all>' + ICONS.copy + ' 전체 복사</button></div>';
    html += '</div>';

    scene.blocks.forEach(function (block) {
      var meta = BLOCK_TYPES[block.type] || BLOCK_TYPES.text;
      if (block.type === 'text' || block.type === 'memo' || block.type === 'truth') {
        var extraCls = block.type === 'memo' ? ' keeper-box' : block.type === 'truth' ? ' truth-box' : '';
        html += '<div class="field-block' + extraCls + '">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span><button class="copy-btn" data-copy-block="' + block.id + '">' + ICONS.copy + ' 복사</button></div>';
        html += '<div class="field-play-box' + (block.content ? '' : ' is-empty') + '">' + escapeHtml(block.content) + '</div>';
        html += '</div>';
      } else if (block.type === 'branches' && block.items.length) {
        html += '<div class="field-block">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        block.items.forEach(function (b) {
          html += '<div class="play-item-card">';
          html += '<div class="play-item-title"><span>' + escapeHtml(b.label || '(제목 없음)') + '</span><button class="copy-btn" data-copy-raw="' + escapeHtml(b.text) + '">' + ICONS.copy + '</button></div>';
          html += '<div class="play-item-body">' + escapeHtml(b.text) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      } else if (block.type === 'lines' && block.items.length) {
        html += '<div class="field-block">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        block.items.forEach(function (b) {
          html += '<div class="play-item-card">';
          html += '<div class="play-item-title"><span>' + (b.label ? escapeHtml(b.label) : '&nbsp;') + '</span><button class="copy-btn" data-copy-raw="' + escapeHtml(b.text) + '">' + ICONS.copy + '</button></div>';
          html += '<div class="play-item-body" style="font-style:italic;">' + escapeHtml(b.text) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      } else if (block.type === 'checks' && block.items.length) {
        html += '<div class="field-block">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        block.items.forEach(function (c) {
          html += '<div class="play-item-card">';
          html += '<div class="play-item-title"><span>' + escapeHtml(c.name || '(판정명 없음)') + '</span></div>';
          html += outcomeRow('crit-success', '대성공', c.critSuccess);
          html += outcomeRow('success', '성공', c.success);
          html += outcomeRow('fail', '실패', c.fail);
          html += outcomeRow('crit-fail', '대실패', c.critFail);
          html += '</div>';
        });
        html += '</div>';
      } else if (block.type === 'npc') {
        html += '<div class="field-block">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        html += '<div class="npc-play-card">';
        html += '<div class="npc-play-head">';
        if (block.imageUrl) html += '<img class="npc-play-avatar" src="' + escapeHtml(block.imageUrl) + '" onerror="this.style.display=\'none\'">';
        else html += '<div class="npc-play-avatar npc-play-avatar-empty"></div>';
        html += '<div><div class="npc-play-name">' + escapeHtml(block.name || '(이름 없음)') + '</div>';
        if (block.role) html += '<div class="npc-play-role">' + escapeHtml(block.role) + '</div>';
        html += '</div></div>';
        var traitLines = (block.traits || '').split('\n').filter(function (l) { return l.trim(); });
        if (traitLines.length) {
          html += '<ul class="npc-play-traits">';
          traitLines.forEach(function (t) { html += '<li>' + escapeHtml(t) + '</li>'; });
          html += '</ul>';
        }
        var dialogueLines = (block.lines || '').split('\n').filter(function (l) { return l.trim(); });

        html += '<div class="field-block">';

      } else if (block.type === 'bgm') {
        var ytId = getYoutubeId(block.url);
        html += '<div class="field-block">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        html += '<div class="bgm-play-card">';
        html += '<div class="bgm-play-head"><span class="bgm-play-note-icon">♪</span><span class="bgm-play-title">' + escapeHtml(block.title || '(제목 없음)') + '</span>';
        if (block.url) html += '<a class="copy-btn" href="' + escapeHtml(block.url) + '" target="_blank" rel="noopener">↗ 열기</a>';
        html += '</div>';

          html += '<div class="bgm-yt-wrap"><iframe src="https://www.youtube.com/embed/' + ytId + '" title="BGM" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>';

        html += '</div></div>';

    // 이전 / 다음 씬 네비게이션
    var flat = getFlatSceneList(scenario);
    var curIdx = flat.findIndex(function (f) { return f.sceneId === scene.id; });

            lines.push('[' + block.label + ']', block.content, '');

  function outcomeRow(cls, label, text) {
    if (!text) return '';
    return '<div class="play-outcome-row"><span class="play-outcome-tag ' + cls + '">' + label + '</span><span class="play-outcome-text">' + escapeHtml(text) + '</span><button class="copy-btn" data-copy-raw="' + escapeHtml(text) + '">' + ICONS.copy + '</button></div>';
  }

  function copyText(text, btn) {
    var done = function () {
      var original = btn.innerHTML;
      btn.classList.add('is-copied');
      btn.innerHTML = ICONS.check + ' 복사됨';
      setTimeout(function () { btn.classList.remove('is-copied'); btn.innerHTML = original; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text || '').then(done).catch(function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text);
      done();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text || '';
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function insertAtCursor(textarea, text) {
    if (!textarea) return;
    var start = textarea.selectionStart, end = textarea.selectionEnd;
    var val = textarea.value;
    textarea.value = val.slice(0, start) + text + val.slice(end);
    textarea.selectionStart = textarea.selectionEnd = start + text.length;
    textarea.focus();
    var event = new Event('input', { bubbles: true });
    textarea.dispatchEvent(event);
  }

  function openPrompt(title, initial, onOk) {
    var modal = document.getElementById('prompt-modal');
    document.getElementById('prompt-modal-title').textContent = title;
    var input = document.getElementById('prompt-modal-input');
    input.value = initial || '';
    modal.hidden = false;
    setTimeout(function () { input.focus(); input.select(); }, 30);

    function close() { modal.hidden = true; cleanup(); }
    function ok() { var v = input.value.trim(); close(); onOk(v); }
    function key(e) { if (e.key === 'Enter') ok(); if (e.key === 'Escape') close(); }

    function cleanup() {
      document.getElementById('prompt-modal-ok').removeEventListener('click', ok);
      document.getElementById('prompt-modal-cancel').removeEventListener('click', close);
      input.removeEventListener('keydown', key);
    }
    document.getElementById('prompt-modal-ok').addEventListener('click', ok);
    document.getElementById('prompt-modal-cancel').addEventListener('click', close);
    input.addEventListener('keydown', key);
  }
