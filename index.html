<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시나리오 대장간 — TRPG 시나리오 관리 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1ec;
  --panel: #ffffff;
  --panel-alt: #f6f7f3;
  --line: #dbe2da;
  --line-strong: #c3ccc2;
  --ink: #232922;
  --muted: #667066;
  --faint: #93a091;
  --accent: #3f6d52;
  --accent-ink: #2c4d3b;
  --accent-soft: rgba(63, 109, 82, 0.1);
  --gold: #a97a3a;
  --gold-soft: rgba(169, 122, 58, 0.1);
  --danger: #af4a3d;
  --danger-soft: rgba(175, 74, 61, 0.09);
  --radius: 6px;
  --shadow: 0 1px 2px rgba(35, 41, 34, 0.06), 0 8px 24px rgba(35, 41, 34, 0.06);
  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', 'Pretendard', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
}

input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

::selection { background: var(--accent-soft); }

/* ============ 레이아웃 ============ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w, 300px) 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas:
    "topbar topbar"
    "sidebar main";
  height: 100vh;
  transition: grid-template-columns .15s ease;
}
.app.sidebar-collapsed { grid-template-columns: 0px 1fr; }

.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-right: 6px;
}

.brand-mark {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  background: var(--accent);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  flex: 0 0 auto;
}

.brand-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  white-space: nowrap;
}

.topbar-spacer { flex: 1; }

.save-indicator {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--faint);
  white-space: nowrap;
  margin-right: 2px;
}

.mode-switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  background: var(--panel-alt);
  gap: 2px;
}

.font-scale-switch {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  background: var(--panel-alt);
  gap: 2px;
}
.font-scale-switch button {
  border: none;
  background: transparent;
  color: var(--muted);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-family: var(--font-body);
  font-weight: 700;
  line-height: 1;
}
.font-scale-switch button:nth-child(1) { font-size: 10px; }
.font-scale-switch button:nth-child(2) { font-size: 13px; }
.font-scale-switch button:nth-child(3) { font-size: 16px; }
.font-scale-switch button.is-active { background: var(--ink); color: #fff; }

.mode-switch button {
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
}

.mode-switch button.is-active {
  background: var(--accent);
  color: #fff;
}

.search-mode-switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  background: var(--panel-alt);
  gap: 2px;
}
.search-mode-switch button {
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
}
.search-mode-switch button.is-active {
  background: var(--accent);
  color: #fff;
}

.scope-switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px;
  margin-bottom: 12px;
  gap: 2px;
}
.scope-switch button {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 11.5px;
  font-weight: 600;
}
.scope-switch button.is-active {
  background: var(--ink);
  color: #fff;
}

.tbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  padding: 7px 12px;
  border-radius: var(--radius);
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
}

.tbtn:hover { border-color: var(--line-strong); background: var(--panel-alt); }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbtn.primary:hover { background: var(--accent-ink); }
.tbtn.danger { color: var(--danger); border-color: var(--danger-soft); }
.tbtn.danger:hover { background: var(--danger-soft); }
.tbtn svg { width: 14px; height: 14px; stroke-width: 2; flex: 0 0 auto; }

/* ============ 사이드바 ============ */
.sidebar {
  grid-area: sidebar;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  min-width: 0;
}
.app.sidebar-collapsed .sidebar { border-right: none; }
.sidebar-inner { width: 300px; min-width: 300px; }
.sidebar-resizer {
  position: absolute;
  top: 0; right: -3px; bottom: 0;
  width: 6px;
  cursor: col-resize;
  z-index: 30;
  background: transparent;
}
.sidebar-resizer:hover, .sidebar-resizer.is-dragging { background: var(--accent-soft); }
.sidebar-collapse-btn {
  position: absolute;
  top: 8px; right: 8px;
  z-index: 5;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  width: 22px; height: 22px;
  border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
}
.sidebar-collapse-btn:hover { color: var(--ink); border-color: var(--accent); }
.sidebar-collapse-btn svg { width: 13px; height: 13px; stroke-width: 2; transition: transform .15s ease; }
.app.sidebar-collapsed .sidebar-collapse-btn svg { transform: rotate(180deg); }
.sidebar-reopen-btn {
  display: none;
  position: fixed;
  left: 6px; top: 64px;
  z-index: 25;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  width: 26px; height: 26px;
  border-radius: 5px;
  align-items: center; justify-content: center;
  box-shadow: var(--shadow);
}
.app.sidebar-collapsed .sidebar-reopen-btn { display: inline-flex; }
.app.sidebar-collapsed .sidebar-inner { visibility: hidden; }

.platform-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--line);
}

.platform-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel-alt);
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
}

.platform-tab .dot {
  width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto;
}

.platform-tab.is-active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

.platform-tab-add {
  border: 1px dashed var(--line-strong);
  background: transparent;
  color: var(--faint);
  border-radius: 999px;
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
}

.sidebar-section {
  padding: 14px;
  border-bottom: 1px solid var(--line);
}

.sidebar-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.sidebar-section-title {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}

.icon-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  width: 24px; height: 24px;
  border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--panel-alt); color: var(--ink); }
.icon-btn svg { width: 15px; height: 15px; stroke-width: 2; }

.scenario-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 9px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
}

.scenario-item:hover { background: var(--panel-alt); }
.scenario-item.is-active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }

.scenario-item-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.recent-item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 9px;
  border-radius: var(--radius);
  cursor: pointer;
}
.recent-item:hover { background: var(--panel-alt); }
.recent-item.is-active { background: var(--accent-soft); }
.recent-item-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
}
.recent-item-sub {
  flex: 0 0 auto;
  max-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 10.5px;
  color: var(--faint);
}

.tree {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.tree-empty {
  color: var(--faint);
  font-size: 12.5px;
  text-align: center;
  padding: 30px 10px;
  line-height: 1.7;
}

.part-block { margin-bottom: 4px; }

.part-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  font-size: 12.5px;
  color: var(--ink);
}

.part-head:hover { background: var(--panel-alt); }

.part-head .chev {
  width: 12px; height: 12px; flex: 0 0 auto;
  color: var(--faint);
  transition: transform .15s ease;
}
.part-block.is-open .part-head .chev { transform: rotate(90deg); }

.part-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }
.part-progress { flex: 0 0 auto; width: 34px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-right: 2px; }
.part-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .2s ease; }
.part-block.is-complete .part-progress-fill { background: var(--gold); }

.part-actions { display: none; gap: 2px; }
.part-head:hover .part-actions { display: flex; }

.scene-list {
  display: none;
  padding-left: 20px;
  margin: 2px 0 6px;
  border-left: 1px solid var(--line);
}
.part-block.is-open .scene-list { display: block; }

.scene-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 8px;
  margin-left: 4px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12.5px;
  color: var(--muted);
  border-left: 2px solid transparent;
}
.scene-item:hover { background: var(--panel-alt); color: var(--ink); }
.scene-item.is-active { background: var(--ink); color: #fff; }
.scene-item.is-done { border-left-color: var(--accent); background: var(--accent-soft); }
.scene-item.is-done.is-active { border-left-color: #fff; }
.scene-item.is-done .scene-item-title { text-decoration: line-through; opacity: 0.6; }
.scene-item.is-done .scene-done-badge {
  flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center;
}
.scene-item.is-done .scene-done-badge svg { width: 9px; height: 9px; stroke-width: 3; }

.scene-done-check {
  flex: 0 0 auto;
  margin: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

.scene-actions { display: none; gap: 1px; flex: 0 0 auto; }
.scene-item:hover .scene-actions { display: flex; }
.scene-actions .icon-btn { width: 20px; height: 20px; color: inherit; font-size: 11px; }
.scene-actions .icon-btn svg { width: 13px; height: 13px; }

.part-actions .icon-btn { font-size: 11px; }
.part-actions .icon-btn:disabled,
.scene-actions .icon-btn:disabled { opacity: 0.3; cursor: default; }
.part-actions .icon-btn:disabled:hover,
.scene-actions .icon-btn:disabled:hover { background: transparent; }

.scene-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.add-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  margin-left: 24px;
  color: var(--faint);
  font-size: 12px;
  border-radius: var(--radius);
  cursor: pointer;
}
.add-row:hover { background: var(--panel-alt); color: var(--accent-ink); }
.add-row svg { width: 12px; height: 12px; }

.add-scenario-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 8px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  margin-top: 4px;
}
.add-scenario-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }

/* ============ 메인 ============ */
.main {
  grid-area: main;
  overflow-y: auto;
  padding: 32px 40px 80px;
}

.main-empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  color: var(--faint);
  text-align: center;
}
.main-empty svg { width: 40px; height: 40px; opacity: .5; margin-bottom: 6px; }
.main-empty h3 { font-family: var(--font-display); font-size: 20px; color: var(--muted); margin: 0; }
.main-empty p { font-size: 13px; max-width: 320px; margin: 0; }

.scene-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}

.breadcrumb {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--faint);
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

.scene-title-input {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 600;
  color: var(--ink);
  border: none;
  background: transparent;
  padding: 0;
  width: 100%;
  outline: none;
}
.scene-title-input:focus { color: var(--accent-ink); }

.scene-play-title {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 600;
  color: var(--ink);
  margin: 0;
}

.scene-header-actions {
  display: flex;
  gap: 8px;
  flex: 0 0 auto;
  padding-top: 4px;
}

.field-block { margin-bottom: 26px; transition: opacity .15s ease; padding-left: 10px; border-left: 3px solid var(--block-color, var(--line)); }
.field-block.is-search-highlight {
  animation: search-flash 1.6s ease;
  border-radius: var(--radius);
}
@keyframes search-flash {
  0%, 100% { box-shadow: none; background: transparent; }
  15%, 60% { box-shadow: 0 0 0 3px var(--accent-soft); background: var(--accent-soft); }
}
.field-block.is-dragging { opacity: 0.35; }
.field-block.is-drag-over { box-shadow: 0 -2px 0 var(--accent); }

.field-block.is-indented {
  margin-left: 28px;
  margin-top: -14px;
  padding-left: 14px;
  border-left: 2px solid var(--line);
}

.block-controls .icon-btn.is-active { background: var(--accent); color: #fff; }

.drag-handle {
  cursor: grab;
  color: var(--faint);
  line-height: 1;
  padding: 2px 2px;
  flex: 0 0 auto;
  user-select: none;
  display: inline-flex;
  align-items: center;
}
.drag-handle svg { width: 15px; height: 15px; }
.drag-handle:active { cursor: grabbing; }

.field-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.field-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  flex: 1;
  min-width: 0;
}
.field-label .swatch { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; display: none; }
.field-label .block-type-icon {
  width: 20px; height: 20px; border-radius: 5px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--block-color-soft, var(--panel-alt));
  color: var(--block-color, var(--muted));
}
.field-label .block-type-icon svg { width: 12px; height: 12px; stroke-width: 2; }

.block-label-input {
  border: none;
  background: transparent;
  font: inherit;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 4px;
  border-radius: 4px;
  min-width: 0;
  flex: 1;
}
.block-label-input:hover { background: var(--panel-alt); }
.block-label-input:focus { outline: none; background: var(--panel-alt); color: var(--ink); }

.block-controls {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 0 0 auto;
}
.block-controls .icon-btn { font-size: 12px; font-weight: 700; color: var(--faint); }
.block-controls .icon-btn:disabled { opacity: 0.3; cursor: default; }
.block-controls .icon-btn:disabled:hover { background: transparent; }

.add-block-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 6px;
  padding-top: 20px;
  border-top: 1px dashed var(--line);
}
.add-block-btn { min-width: 150px; }

@media (max-width: 640px) {
  .add-block-bar { flex-direction: column; }
}

.field-textarea {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 14px;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--ink);
  resize: none;
  overflow: hidden;
  outline: none;
}
.field-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.field-play-box {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-alt);
  padding: 16px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--ink);
  position: relative;
}
.field-play-box:empty::before,
.field-play-box.is-empty::before {
  content: "(내용 없음)";
  color: var(--faint);
}

.field-play-box.text-lines {
  white-space: normal;
  padding: 6px 8px;
}
.text-line {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 8px;
  border-radius: 5px;
}
.text-line:hover { background: rgba(0, 0, 0, 0.035); }
.text-line span { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.text-line .line-copy-btn {
  flex: 0 0 auto;
  opacity: 0.4;
  transition: opacity .12s ease;
}
.text-line:hover .line-copy-btn,
.text-line .line-copy-btn:focus,
.text-line .line-copy-btn:hover { opacity: 1; }
.text-line-empty { height: 10px; }

.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.copy-btn svg { width: 11px; height: 11px; }
.copy-btn.is-copied { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }

.keeper-box .field-textarea,
.keeper-box .field-play-box {
  background: var(--gold-soft);
  border-color: rgba(169, 122, 58, 0.28);
}

.truth-box .field-textarea,
.truth-box .field-play-box,
.truth-box.field-block .field-play-box {
  background: rgba(92, 47, 61, 0.07);
  border-color: rgba(92, 47, 61, 0.3);
}
.truth-box .field-label { color: #5c2f3d; }

/* 명령어 삽입 바 */
.command-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
#floating-command-bar {
  z-index: 60;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 8px;
  box-shadow: var(--shadow);
  margin-bottom: 0;
  pointer-events: auto;
}
#floating-command-bar[hidden] { display: none; }
.command-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel-alt);
  color: var(--muted);
  padding: 4px 10px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.command-chip:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.command-chip-manage {
  border: 1px dashed var(--line-strong);
  color: var(--faint);
  background: transparent;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
}
.command-chip-manage:hover { color: var(--accent-ink); border-color: var(--accent); }

/* 분기 / 판정 카드 */
.item-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 14px;
  margin-bottom: 10px;
  border-left: 3px solid var(--line);
}
.item-card-branch { border-left-color: #3a5a9c; }
.item-card-line { border-left-color: #c1622e; border-left-style: dashed; }
.item-card-check { border-left-color: var(--danger); }
.item-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.item-card-head input.mini-input {
  flex: 1;
  border: none;
  border-bottom: 1px dashed var(--line-strong);
  background: transparent;
  font-weight: 700;
  font-size: 13px;
  padding: 2px 0;
  outline: none;
  color: var(--ink);
}
.item-card-head input.mini-input:focus { border-color: var(--accent); }

.remove-btn {
  border: none;
  background: transparent;
  color: var(--faint);
  width: 22px; height: 22px;
  border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
}
.remove-btn:hover { background: var(--danger-soft); color: var(--danger); }
.remove-btn svg { width: 14px; height: 14px; }

.outcome-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
@media (max-width: 720px) { .outcome-grid { grid-template-columns: 1fr; } }

.outcome-field { display: flex; flex-direction: column; gap: 5px; }
.outcome-label {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
  padding: 2px 0;
}
.outcome-label.crit-success { color: var(--gold); }
.outcome-label.success { color: var(--accent); }
.outcome-label.fail { color: var(--muted); }
.outcome-label.crit-fail { color: var(--danger); }
.outcome-field textarea {
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 8px 9px;
  font-size: 12.5px;
  min-height: 40px;
  resize: none;
  overflow: hidden;
  outline: none;
}
.outcome-field.crit-success textarea { background: var(--gold-soft); }
.outcome-field.success textarea { background: var(--accent-soft); }
.outcome-field.fail textarea { background: var(--panel-alt); }
.outcome-field.crit-fail textarea { background: var(--danger-soft); }
.outcome-field textarea:focus { border-color: var(--accent); }

.add-item-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px dashed var(--line-strong);
  background: transparent;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: var(--radius);
  font-size: 12.5px;
  font-weight: 600;
  width: 100%;
  justify-content: center;
}
.add-item-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.add-item-btn svg { width: 13px; height: 13px; }

/* 플레이 모드 - 분기/판정 카드 */
.play-item-card {
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--panel);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.play-item-card-branch { background: linear-gradient(90deg, rgba(58, 90, 156, 0.05), transparent 40%); }
.play-item-card-line {
  border-left-style: dashed;
  background: linear-gradient(90deg, rgba(193, 98, 46, 0.05), transparent 40%);
}
.play-item-card-check { background: linear-gradient(90deg, rgba(175, 74, 61, 0.05), transparent 40%); }
.play-item-title {
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.play-item-title > span:first-child { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.item-type-icon { width: 14px; height: 14px; flex: 0 0 auto; opacity: 0.7; stroke-width: 1.8; }
.play-item-body { font-size: 13px; line-height: 1.7; white-space: pre-wrap; color: var(--ink); }

.play-outcome-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 0;
  border-top: 1px dashed var(--line);
  font-size: 12.5px;
}
.play-outcome-row:first-child { border-top: none; }
.play-outcome-row .copy-btn { flex: 0 0 auto; }
.play-outcome-tag {
  flex: 0 0 68px;
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  padding-top: 1px;
}
.play-outcome-tag.crit-success { color: var(--gold); }
.play-outcome-tag.success { color: var(--accent); }
.play-outcome-tag.fail { color: var(--muted); }
.play-outcome-tag.crit-fail { color: var(--danger); }
.play-outcome-text { flex: 1; white-space: pre-wrap; color: var(--ink); }

/* NPC 카드 - 편집 */
.npc-form { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--panel); }
.npc-form-row { display: flex; gap: 12px; margin-bottom: 12px; }
.npc-avatar-edit {
  width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex: 0 0 auto;
  background: var(--panel-alt); border: 1px solid var(--line);
}
.npc-avatar-edit img { width: 100%; height: 100%; object-fit: cover; }
.npc-form-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.npc-form-fields input {
  border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; font-size: 12.5px; outline: none; width: 100%;
}
.npc-form-fields input:focus { border-color: var(--accent); }
.npc-form > input[type="text"] {
  width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px; font-size: 12.5px; outline: none; box-sizing: border-box;
}
.npc-form > input[type="text"]:focus { border-color: var(--accent); }
.npc-sub-label { display: block; font-size: 10.5px; font-weight: 700; color: var(--faint); letter-spacing: 0.04em; margin: 10px 0 5px; }
.npc-form textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px;
  font-size: 12.5px; min-height: 40px; resize: none; overflow: hidden; outline: none;
}
.npc-form textarea:focus { border-color: var(--accent); }

/* NPC 카드 - 플레이 */
.npc-play-card { border: 1px solid var(--line); border-left: 3px solid #7a5c8a; border-radius: 0 var(--radius) var(--radius) 0; background: var(--panel); padding: 14px; }
.npc-play-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.npc-play-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; border: 1px solid var(--line); }
.npc-play-avatar-empty { background: var(--panel-alt); }
.npc-play-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); }
.npc-play-role { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.npc-play-traits { margin: 0 0 10px; padding-left: 18px; font-size: 12.5px; color: var(--ink); line-height: 1.7; }
.npc-play-line {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: 7px 0; border-top: 1px dashed var(--line); font-size: 13px; font-style: italic; color: var(--ink);
}
.npc-play-line:first-of-type { border-top: none; }
.npc-play-line .copy-btn { flex: 0 0 auto; }

/* 핸드아웃 - 편집 */
textarea.handout-gmnote { background: var(--gold-soft); border-color: rgba(169, 122, 58, 0.28); }

/* 핸드아웃 - 플레이 */
.handout-play-card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.handout-play-title {
  padding: 12px 16px 0; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink);
}
.handout-play-content { padding: 14px 16px; white-space: pre-wrap; font-size: 13.5px; line-height: 1.8; color: var(--ink); }
.handout-gmnote-play {
  margin-top: 8px; border: 1px solid rgba(169, 122, 58, 0.28); background: var(--gold-soft);
  border-radius: var(--radius); padding: 10px 12px; font-size: 12.5px; color: var(--ink); white-space: pre-wrap; line-height: 1.6;
}
.handout-gmnote-tag {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 1px 8px; margin-right: 8px; vertical-align: 1px;
}

/* BGM - 플레이 */
.bgm-play-card { border: 1px solid var(--line); border-left: 3px solid #9c4f6b; border-radius: 0 var(--radius) var(--radius) 0; background: var(--panel); padding: 12px 14px; }
.bgm-play-head { display: flex; align-items: center; gap: 8px; }
.bgm-play-note-icon { color: #9c4f6b; font-size: 15px; flex: 0 0 auto; }
.bgm-play-title { flex: 1; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink); }
.bgm-yt-wrap { position: relative; padding-top: 56.25%; margin-top: 10px; border-radius: 5px; overflow: hidden; background: #000; }
.bgm-yt-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.bgm-play-note { margin-top: 8px; font-size: 12px; color: var(--muted); white-space: pre-wrap; line-height: 1.6; }

/* 이전 / 다음 씬 네비게이션 */
.scene-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}
.scene-nav-btn {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 10px 14px;
  text-align: left;
}
.scene-nav-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.scene-nav-next { text-align: right; align-items: flex-end; }
.scene-nav-dir { font-size: 10.5px; font-weight: 700; color: var(--faint); letter-spacing: 0.03em; }
.scene-nav-title { font-family: var(--font-display); font-size: 14px; color: var(--ink); font-weight: 600; }

@media (max-width: 640px) {
  .scene-nav { grid-template-columns: 1fr; }
}

/* ============ 모달 ============ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(20, 26, 20, 0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 24px;
}
.modal-backdrop[hidden] { display: none; }

.modal {
  background: var(--panel);
  border-radius: 10px;
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 560px;
  max-height: 84vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
}
.modal-head h3 { margin: 0; font-family: var(--font-display); font-size: 17px; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 14px 20px; border-top: 1px solid var(--line);
}

.form-row { margin-bottom: 14px; }
.form-row label {
  display: block; font-size: 11.5px; font-weight: 700; color: var(--muted);
  margin-bottom: 6px; letter-spacing: 0.03em;
}
.form-row input[type=text], .form-row textarea, .form-row input[type=search] {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 9px 11px;
  outline: none;
}
.form-row input:focus, .form-row textarea:focus { border-color: var(--accent); }

.command-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 4px;
}
.command-manage-chip {
  border: 1px solid var(--line);
  background: var(--panel-alt);
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  cursor: grab;
}
.command-manage-chip:hover { border-color: var(--accent); color: var(--accent-ink); }
.command-manage-chip.is-active { background: var(--ink); color: #fff; border-color: var(--ink); }
.command-manage-chip.is-dragging { opacity: 0.35; }

.command-editor {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  margin-top: 10px;
  background: var(--panel-alt);
}
.command-editor input[type="text"] {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 9px;
  font-size: 12.5px;
  outline: none;
  background: var(--panel);
}
.command-editor input[type="text"]:focus { border-color: var(--accent); }
.command-editor textarea.snippet {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 9px;
  font-size: 12.5px;
  font-family: var(--font-mono);
  resize: none;
  overflow: hidden;
  outline: none;
  min-height: 34px;
  line-height: 1.5;
  background: var(--panel);
}
.command-editor textarea.snippet:focus { border-color: var(--accent); }

.color-quickadd {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  background: var(--panel-alt);
}
.color-quickadd-row { display: flex; gap: 8px; align-items: center; }
.color-quickadd-row input[type="color"] {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
  background: var(--panel);
}
.color-quickadd-hex {
  flex: 0 0 90px;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 8px 9px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  text-transform: uppercase;
}
.color-quickadd-row input[type="text"]:not(.color-quickadd-hex) {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 8px 9px;
  font-size: 12.5px;
}

.palette-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 2px;
  border-bottom: 1px solid var(--line);
}
.palette-row:first-child { padding-top: 0; }
.palette-swatch {
  width: 22px; height: 22px; border-radius: 5px; flex: 0 0 auto;
  border: 1px solid rgba(0,0,0,0.12);
}
.palette-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-hex { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); flex: 0 0 auto; }

.color-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
}
.color-swatch.is-selected { border-color: var(--ink); }

.replace-preview {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  background: var(--panel-alt);
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 14px;
}
.replace-preview b { color: var(--accent-ink); }

#find-results { max-height: 360px; overflow-y: auto; }
.find-result-item {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.find-result-item:hover { border-color: var(--accent); background: var(--accent-soft); }
.find-result-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.find-result-title { font-family: var(--font-display); font-weight: 700; font-size: 13.5px; color: var(--ink); }
.find-result-count { flex: 0 0 auto; font-size: 10.5px; color: var(--faint); font-weight: 700; }
.find-result-path { font-size: 10.5px; color: var(--faint); margin-top: 2px; }
.find-result-snippet { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.find-result-snippet mark { background: var(--gold-soft); color: var(--ink); font-weight: 700; border-radius: 2px; }

.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--ink);
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  z-index: 200;
}
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.has-action { pointer-events: auto; display: flex; align-items: center; gap: 12px; }
.toast-undo-btn {
  border: 1px solid rgba(255,255,255,.4);
  background: transparent;
  color: #fff;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
}
.toast-undo-btn:hover { background: rgba(255,255,255,.15); }

/* ============ 타임라인 뷰 ============ */
.timeline-wrap { display: flex; flex-direction: column; gap: 4px; }
.timeline-part { margin-bottom: 6px; }
.timeline-part-title {
  font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink);
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.timeline-part-title .part-count { font-family: var(--font-mono); font-size: 11px; color: var(--faint); font-weight: 500; }
.timeline-row { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0 2px; }
.timeline-node {
  display: flex; flex-direction: column; gap: 6px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); padding: 10px 12px; min-width: 150px; max-width: 190px;
  cursor: pointer;
}
.timeline-node:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.timeline-node.is-active { border-color: var(--accent); background: var(--accent-soft); }
.timeline-node.is-done { border-left: 3px solid var(--accent); }
.timeline-node-title {
  font-size: 12.5px; font-weight: 700; color: var(--ink); overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.timeline-node-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.timeline-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 999px; background: var(--panel-alt); color: var(--muted);
  border: 1px solid var(--line);
}
.timeline-badge svg { width: 10px; height: 10px; vertical-align: -1px; }
.timeline-badge.branch { color: #3a5a9c; border-color: rgba(58,90,156,.3); }
.timeline-badge.check { color: var(--danger); border-color: var(--danger-soft); }
.timeline-badge.done { color: var(--accent); border-color: rgba(63,109,82,.3); }
.timeline-arrow {
  display: flex; align-items: center; justify-content: center;
  color: var(--faint); flex: 0 0 auto; padding: 0 6px; font-size: 16px;
}
.timeline-part-arrow-down {
  display: flex; justify-content: flex-start; padding: 6px 0 6px 20px; color: var(--faint); font-size: 15px;
}
.timeline-empty { color: var(--faint); font-size: 13px; text-align: center; padding: 50px 10px; }
@media (max-width: 640px) {
  .timeline-node { min-width: 130px; max-width: 100%; flex: 1 1 130px; }
}

@media (max-width: 1024px) {
  .app { grid-template-columns: 240px 1fr !important; }
  .sidebar-inner { width: 240px; min-width: 240px; }
  .topbar { flex-wrap: wrap; height: auto; min-height: 56px; padding: 8px 12px; }
  .app { grid-template-rows: auto 1fr; }
  .tbtn span.tbtn-label { display: none; }
}

@media (max-width: 860px) {
  .app, .app.sidebar-collapsed { grid-template-columns: 1fr !important; grid-template-areas: "topbar" "main"; }
  .sidebar { position: fixed; inset: 56px 0 0 0; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; width: 82vw; max-width: 320px; }

}

@media (max-width: 520px) {
  .topbar .brand-name { display: none; }

}
</style>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'scenario-forge-data-v1';
  var RECENT_KEY = 'scenario-forge-recent-v1';

  var PLATFORM_COLORS = ['#3f6d52', '#a97a3a', '#4a5a8a', '#af4a3d', '#6b6b6b', '#7a5c8a'];

  var ICONS = {
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    branch: '<svg class="item-type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 8.4V15.6M8.2 7.3C11 8.6 13 10 15.8 11" stroke-linecap="round"/></svg>',
    quote: '<svg class="item-type-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 8c-2.2 0-4 1.8-4 4 0 2 1.4 3.6 3.3 3.9-.2 1-.9 1.8-2 2.3v1.6c2.6-.4 4.7-2.6 4.7-5.6V8H7zm10 0c-2.2 0-4 1.8-4 4 0 2 1.4 3.6 3.3 3.9-.2 1-.9 1.8-2 2.3v1.6c2.6-.4 4.7-2.6 4.7-5.6V8h-2z"/></svg>',
    dice: '<svg class="item-type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>'
  };

  function uid() {
    return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function getYoutubeId(url) {
    if (!url) return null;
    var m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  function isAudioFileUrl(url) {
    return /\.(mp3|ogg|wav|m4a|flac|aac)(\?.*)?$/i.test(url || '');
  }

  function defaultData() {
    var roll20Id = uid();
    var kokoId = uid();
    return {
      platforms: [
        {
          id: roll20Id, name: 'Roll20', color: '#3f6d52',
          commands: [
            { id: uid(), label: '지문(desc)', snippet: '/desc ' },
            { id: uid(), label: '굵게', snippet: '**굵은 글씨**' },
            { id: uid(), label: '색 강조(빨강)', snippet: '<span style="color:#c0392b">강조 텍스트</span>' },
            { id: uid(), label: '배경 강조', snippet: '<span style="background:#fdf3d0">강조 텍스트</span>' }
          ]
        },
        {
          id: kokoId, name: '코코포리아', color: '#4a5a8a',
          commands: [
            { id: uid(), label: '귓속말', snippet: '((귓속말: ))' },
            { id: uid(), label: '설명', snippet: '【설명】' }
          ]
        }
      ],
      scenarios: [],
      library: { npcs: [], items: [], places: [] },
      selection: { platformId: roll20Id, scenarioId: null, partId: null, sceneId: null }
    };
  }

  var HISTORY_LIMIT = 50;
  var HISTORY_DEBOUNCE_MS = 600;

  var state = {
    data: loadData(),
    mode: 'edit',
    currentPlatformId: null,
    currentScenarioId: null,
    currentPartId: null,
    currentSceneId: null,
    openParts: {},
    recentScenes: loadRecentScenes(),
    history: [],
    historyIndex: -1,
    historyTimer: null,
    isRestoringHistory: false,
    libraryTab: 'npcs',
    openLibraryId: null
  };

  function loadRecentScenes() {
    try {
      var raw = localStorage.getItem(RECENT_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function trackRecentScene(scenarioId, partId, sceneId) {
    state.recentScenes = state.recentScenes.filter(function (r) { return r.sceneId !== sceneId; });
    state.recentScenes.unshift({ scenarioId: scenarioId, partId: partId, sceneId: sceneId, t: Date.now() });
    state.recentScenes = state.recentScenes.slice(0, 8);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(state.recentScenes)); } catch (e) {}
  }

  function loadData() {
    var d;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      d = raw ? JSON.parse(raw) : defaultData();
    } catch (e) {
      d = defaultData();
    }
    migrateData(d);
    return d;
  }

  // 예전 버전(본문/키퍼메모/분기/판정 고정 필드)으로 저장된 씬을
  // 자유 순서 블록(blocks) 구조로 자동 변환합니다.
  function migrateData(d) {
    if (!d.library) d.library = { npcs: [], items: [], places: [] };
    ['npcs', 'items', 'places'].forEach(function (k) {
      if (!Array.isArray(d.library[k])) d.library[k] = [];
    });
    (d.scenarios || []).forEach(function (scenario) {
      (scenario.parts || []).forEach(function (part) {
        (part.scenes || []).forEach(function (scene) {
          if (Array.isArray(scene.blocks)) return;
          var blocks = [];
          if (scene.content) blocks.push({ id: uid(), type: 'text', label: '나레이션', content: scene.content });
          if (scene.keeperMemo) blocks.push({ id: uid(), type: 'memo', label: '키퍼 메모', content: scene.keeperMemo });
          if (scene.branches && scene.branches.length) blocks.push({ id: uid(), type: 'branches', label: '선택지에 따른 분기', items: scene.branches });
          if (scene.checks && scene.checks.length) blocks.push({ id: uid(), type: 'checks', label: '주사위 판정 결과', items: scene.checks });
          if (!blocks.length) blocks.push({ id: uid(), type: 'text', label: '나레이션', content: '' });
          scene.blocks = blocks;
          delete scene.content;
          delete scene.keeperMemo;
          delete scene.branches;
          delete scene.checks;
        });
      });
    });
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      updateSaveIndicator();
    } catch (e) {
      showToast('저장 실패: 브라우저 저장공간을 확인해주세요');
    }
    scheduleHistoryPush();
  }

  /* ---------- 실행 취소 / 다시 실행 히스토리 ---------- */
  function snapshotData() {
    return JSON.stringify(state.data);
  }

  function pushHistorySnapshot() {
    if (state.isRestoringHistory) return;
    var snap = snapshotData();
    if (state.historyIndex >= 0 && state.history[state.historyIndex] === snap) return;
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push(snap);
    if (state.history.length > HISTORY_LIMIT) state.history.shift();
    state.historyIndex = state.history.length - 1;
    updateUndoRedoButtons();
  }

  function scheduleHistoryPush() {
    if (state.isRestoringHistory) return;
    clearTimeout(state.historyTimer);
    state.historyTimer = setTimeout(pushHistorySnapshot, HISTORY_DEBOUNCE_MS);
  }

  function resetHistory() {
    state.history = [snapshotData()];
    state.historyIndex = 0;
    updateUndoRedoButtons();
  }

  function updateUndoRedoButtons() {
    var undoBtn = document.getElementById('undo-btn');
    var redoBtn = document.getElementById('redo-btn');
    if (!undoBtn || !redoBtn) return;
    undoBtn.disabled = state.historyIndex <= 0;
    redoBtn.disabled = state.historyIndex >= state.history.length - 1;
  }

  // undo/redo로 데이터가 통째로 바뀔 때, 현재 선택된 시나리오/파트/씬이
  // 더 이상 존재하지 않으면 안전한 상태로 되돌린다.
  function ensureSelectionValidity() {
    if (state.currentPlatformId && !getPlatform(state.currentPlatformId)) {
      state.currentPlatformId = null;
    }
    if (state.currentScenarioId) {
      var sc = getScenario(state.currentScenarioId);
      if (!sc) {
        state.currentScenarioId = null;
        state.currentPartId = null;
        state.currentSceneId = null;
      } else {
        if (!state.currentPlatformId) state.currentPlatformId = sc.platformId;
        if (state.currentPartId) {
          var pt = getPart(sc, state.currentPartId);
          if (!pt) {
            state.currentPartId = null;
            state.currentSceneId = null;
          } else if (state.currentSceneId) {
            var scn = getScene(sc, pt, state.currentSceneId);
            if (!scn) state.currentSceneId = null;
          }
        }
      }
    }
    ensureSelection();
  }

  function restoreHistoryIndex(idx) {
    if (idx < 0 || idx >= state.history.length) return;
    state.isRestoringHistory = true;
    state.historyIndex = idx;
    var snap = state.history[idx];
    state.data = JSON.parse(snap);
    migrateData(state.data);
    ensureSelectionValidity();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      updateSaveIndicator();
    } catch (e) {}
    render();
    state.isRestoringHistory = false;
    updateUndoRedoButtons();
  }

  function undo() {
    clearTimeout(state.historyTimer);
    var curSnap = snapshotData();
    if (state.historyIndex >= 0 && state.history[state.historyIndex] !== curSnap) {
      pushHistorySnapshot();
    }
    if (state.historyIndex <= 0) { showToast('더 이상 되돌릴 수 없어요'); return; }
    restoreHistoryIndex(state.historyIndex - 1);
    showToast('실행 취소');
  }

  function redo() {
    if (state.historyIndex >= state.history.length - 1) { showToast('다시 실행할 내용이 없어요'); return; }
    restoreHistoryIndex(state.historyIndex + 1);
    showToast('다시 실행');
  }

  function updateSaveIndicator() {
    var el = document.getElementById('save-indicator');
    if (!el) return;
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var ss = String(now.getSeconds()).padStart(2, '0');
    el.textContent = '저장됨 ' + hh + ':' + mm + ':' + ss;
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.innerHTML = '';
    t.textContent = msg;
    t.classList.remove('has-action');
    t.classList.add('is-visible');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function () { t.classList.remove('is-visible'); }, 1800);
  }

  function showUndoToast(label, onUndo) {
    var t = document.getElementById('toast');
    clearTimeout(showToast._timer);
    var handled = false;
    t.innerHTML = '';
    var span = document.createElement('span');
    span.textContent = label + ' 삭제됨';
    var btn = document.createElement('button');
    btn.className = 'toast-undo-btn';
    btn.textContent = '되돌리기';
    btn.addEventListener('click', function () {
      if (handled) return;
      handled = true;
      t.classList.remove('is-visible');
      onUndo();
    });
    t.appendChild(span);
    t.appendChild(btn);
    t.classList.add('has-action');
    t.classList.add('is-visible');
    showToast._timer = setTimeout(function () {
      t.classList.remove('is-visible');
    }, 6000);
  }

  /* ---------- 데이터 조회 헬퍼 ---------- */
  function getPlatform(id) { return state.data.platforms.find(function (p) { return p.id === id; }); }
  function getScenario(id) { return state.data.scenarios.find(function (s) { return s.id === id; }); }
  function getScenariosForPlatform(platformId) {
    return state.data.scenarios.filter(function (s) { return s.platformId === platformId; });
  }
  function getPart(scenario, partId) {
    return scenario && scenario.parts.find(function (p) { return p.id === partId; });
  }
  function getScene(scenario, part, sceneId) {
    return part && part.scenes.find(function (sc) { return sc.id === sceneId; });
  }
  function getCurrentScenario() { return getScenario(state.currentScenarioId); }
  function getCurrentPart() {
    var sc = getCurrentScenario();
    return sc && getPart(sc, state.currentPartId);
  }
  function getCurrentScene() {
    var part = getCurrentPart();
    return part && getScene(getCurrentScenario(), part, state.currentSceneId);
  }

  /* ---------- 초기 선택 ---------- */
  function ensureSelection() {
    if (!state.currentPlatformId && state.data.platforms.length) {
      state.currentPlatformId = state.data.platforms[0].id;
    }
  }

  function ensureLibrary() {
    if (!state.data.library) state.data.library = { npcs: [], items: [], places: [] };
    ['npcs', 'items', 'places'].forEach(function (k) {
      if (!Array.isArray(state.data.library[k])) state.data.library[k] = [];
    });
  }

  function moveInArray(arr, id, dir) {
    var i = arr.findIndex(function (item) { return item.id === id; });
    var j = i + dir;
    if (i === -1 || j < 0 || j >= arr.length) return;
    var tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }

  // 현재 시나리오의 모든 씬을 파트 순서 -> 씬 순서로 평평하게 나열
  function getFlatSceneList(scenario) {
    var flat = [];
    scenario.parts.forEach(function (part) {
      part.scenes.forEach(function (scene) {
        flat.push({ partId: part.id, sceneId: scene.id, partTitle: part.title, sceneTitle: scene.title });
      });
    });
    return flat;
  }

  /* ================= 렌더링 ================= */

  function render() {
    renderPlatformTabs();
    renderRecentList();
    renderScenarioList();
    renderTree();
    renderMain();
  }

  function renderPlatformTabs() {
    var wrap = document.getElementById('platform-tabs');
    var html = '';
    state.data.platforms.forEach(function (p) {
      var active = p.id === state.currentPlatformId;
      html += '<button class="platform-tab' + (active ? ' is-active' : '') + '" data-platform="' + p.id + '">' +
        '<span class="dot" style="background:' + p.color + '"></span>' + escapeHtml(p.name) + '</button>';
    });
    html += '<button class="platform-tab-add" id="platform-add-btn" title="사이트 추가">' + ICONS.plus + '</button>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-platform]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.currentPlatformId = btn.getAttribute('data-platform');
        state.currentScenarioId = null;
        state.currentPartId = null;
        state.currentSceneId = null;
        render();
      });
    });
    document.getElementById('platform-add-btn').addEventListener('click', openPlatformModal);
  }

  function renderRecentList() {
    var section = document.getElementById('recent-section');
    var wrap = document.getElementById('recent-list');
    if (!section || !wrap) return;

    var entries = state.recentScenes.map(function (r) {
      var scenario = getScenario(r.scenarioId);
      var part = scenario && getPart(scenario, r.partId);
      var scene = part && getScene(scenario, part, r.sceneId);
      if (!scenario || !part || !scene) return null;
      return { scenario: scenario, part: part, scene: scene, r: r };
    }).filter(Boolean).slice(0, 6);

    if (!entries.length) {
      section.hidden = true;
      return;
    }
    section.hidden = false;

    var html = '';
    entries.forEach(function (e) {
      var active = e.scene.id === state.currentSceneId;
      html += '<div class="recent-item' + (active ? ' is-active' : '') + '" data-recent-platform="' + e.scenario.platformId + '" data-recent-scenario="' + e.scenario.id + '" data-recent-part="' + e.part.id + '" data-recent-scene="' + e.scene.id + '">';
      html += '<span class="recent-item-title">' + escapeHtml(e.scene.title) + '</span>';
      html += '<span class="recent-item-sub">' + escapeHtml(e.scenario.title) + '</span>';
      html += '</div>';
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-recent-scene]').forEach(function (el) {
      el.addEventListener('click', function () {
        state.currentPlatformId = el.getAttribute('data-recent-platform');
        state.currentScenarioId = el.getAttribute('data-recent-scenario');
        state.currentPartId = el.getAttribute('data-recent-part');
        state.currentSceneId = el.getAttribute('data-recent-scene');
        state.openParts[state.currentPartId] = true;
        render();
      });
    });
  }

  function renderScenarioList() {
    var wrap = document.getElementById('scenario-list');
    var list = getScenariosForPlatform(state.currentPlatformId);
    if (!list.length) {
      wrap.innerHTML = '<div class="tree-empty" style="padding:14px 4px;">이 사이트로 진행하는<br>시나리오가 아직 없어요.</div>';
      return;
    }
    var html = '';
    list.forEach(function (s) {
      var active = s.id === state.currentScenarioId;
      html += '<div class="scenario-item' + (active ? ' is-active' : '') + '" data-scenario="' + s.id + '">' +
        '<span class="scenario-item-title">' + escapeHtml(s.title) + '</span>' +
        '<button class="icon-btn scenario-del" data-scenario-del="' + s.id + '" title="삭제">' + ICONS.trash + '</button>' +
        '</div>';
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-scenario]').forEach(function (el) {
      el.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-scenario-del]')) return;
        state.currentScenarioId = el.getAttribute('data-scenario');
        state.currentPartId = null;
        state.currentSceneId = null;
        render();
      });
    });
    wrap.querySelectorAll('[data-scenario-del]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var id = btn.getAttribute('data-scenario-del');
        var sc = getScenario(id);
        if (!sc) return;
        if (!confirm('"' + sc.title + '" 시나리오를 삭제할까요? 안의 모든 파트·씬이 함께 삭제됩니다.')) return;
        var idx = state.data.scenarios.findIndex(function (s) { return s.id === id; });
        state.data.scenarios = state.data.scenarios.filter(function (s) { return s.id !== id; });
        if (state.currentScenarioId === id) {
          state.currentScenarioId = null;
          state.currentPartId = null;
          state.currentSceneId = null;
        }
        saveData();
        render();
        showUndoToast('"' + sc.title + '" 시나리오', function () {
          state.data.scenarios.splice(idx, 0, sc);
          saveData();
          render();
        });
      });
    });
  }

  function renderTree() {
    var wrap = document.getElementById('tree');
    var scenario = getCurrentScenario();
    if (!scenario) {
      wrap.innerHTML = '<div class="tree-empty">왼쪽에서 시나리오를<br>먼저 선택하거나 만들어주세요.</div>';
      return;
    }
    var html = '';
    scenario.parts.forEach(function (part, partIdx) {
      var isOpen = !!state.openParts[part.id];
      var doneCount = part.scenes.filter(function (s) { return s.done; }).length;
      var isPartComplete = part.scenes.length > 0 && doneCount === part.scenes.length;
      html += '<div class="part-block' + (isOpen ? ' is-open' : '') + (isPartComplete ? ' is-complete' : '') + '" data-part="' + part.id + '">';
      html += '<div class="part-head" data-part-toggle="' + part.id + '">';
      html += '<span class="chev">' + ICONS.chev + '</span>';
      html += '<span class="part-title">' + escapeHtml(part.title) + '</span>';
      html += '<span class="part-progress"><span class="part-progress-fill" style="width:' + (part.scenes.length ? Math.round(doneCount / part.scenes.length * 100) : 0) + '%"></span></span>';
      html += '<span class="part-count">' + doneCount + '/' + part.scenes.length + '</span>';
      html += '<span class="part-actions">' +
        '<button class="icon-btn" data-part-up="' + part.id + '" title="위로" ' + (partIdx === 0 ? 'disabled' : '') + '>↑</button>' +
        '<button class="icon-btn" data-part-down="' + part.id + '" title="아래로" ' + (partIdx === scenario.parts.length - 1 ? 'disabled' : '') + '>↓</button>' +
        '<button class="icon-btn" data-part-rename="' + part.id + '" title="이름 변경">✎</button>' +
        '<button class="icon-btn" data-part-del="' + part.id + '" title="삭제">' + ICONS.trash + '</button>' +
        '</span>';
      html += '</div>';

      html += '<div class="scene-list">';
      part.scenes.forEach(function (scene, sceneIdx) {
        var active = scene.id === state.currentSceneId && part.id === state.currentPartId;
        html += '<div class="scene-item' + (active ? ' is-active' : '') + (scene.done ? ' is-done' : '') + '" data-scene="' + scene.id + '" data-scene-part="' + part.id + '">' +
          '<input type="checkbox" class="scene-done-check" data-scene-done="' + scene.id + '" data-scene-done-part="' + part.id + '" ' + (scene.done ? 'checked' : '') + ' title="진행 완료 표시">' +
          (scene.done ? '<span class="scene-done-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' : '') +
          '<span class="scene-item-title">' + escapeHtml(scene.title) + '</span>' +
          '<span class="scene-actions">' +
          '<button class="icon-btn" data-scene-up="' + scene.id + '" data-scene-up-part="' + part.id + '" title="위로" ' + (sceneIdx === 0 ? 'disabled' : '') + '>↑</button>' +
          '<button class="icon-btn" data-scene-down="' + scene.id + '" data-scene-down-part="' + part.id + '" title="아래로" ' + (sceneIdx === part.scenes.length - 1 ? 'disabled' : '') + '>↓</button>' +
          '<button class="icon-btn scene-del" data-scene-del="' + scene.id + '" data-scene-del-part="' + part.id + '" title="삭제">' + ICONS.trash + '</button>' +
          '</span>' +
          '</div>';
      });
      html += '<div class="add-row" data-add-scene="' + part.id + '">' + ICONS.plus + ' 새 씬</div>';
      html += '</div>'; // scene-list
      html += '</div>'; // part-block
    });
    html += '<div class="add-row" data-add-part style="margin-left:8px; margin-top:4px;">' + ICONS.plus + ' 새 파트(폴더)</div>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-part-toggle]').forEach(function (el) {
      el.addEventListener('click', function (ev) {
        if (ev.target.closest('.part-actions')) return;
        var id = el.getAttribute('data-part-toggle');
        state.openParts[id] = !state.openParts[id];
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-part-rename]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var id = btn.getAttribute('data-part-rename');
        var part = getPart(scenario, id);
        openPrompt('파트 이름 변경', part.title, function (val) {
          if (!val) return;
          part.title = val;
          saveData();
          renderTree();
        });
      });
    });
    wrap.querySelectorAll('[data-part-del]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var id = btn.getAttribute('data-part-del');
        var part = getPart(scenario, id);
        if (!confirm('"' + part.title + '" 파트를 삭제할까요? 안의 씬도 함께 삭제됩니다.')) return;
        var idx = scenario.parts.findIndex(function (p) { return p.id === id; });
        scenario.parts = scenario.parts.filter(function (p) { return p.id !== id; });
        if (state.currentPartId === id) { state.currentPartId = null; state.currentSceneId = null; }
        saveData();
        render();
        showUndoToast('"' + part.title + '" 파트', function () {
          scenario.parts.splice(idx, 0, part);
          saveData();
          render();
        });
      });
    });
    wrap.querySelectorAll('[data-part-up]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        moveInArray(scenario.parts, btn.getAttribute('data-part-up'), -1);
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-part-down]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        moveInArray(scenario.parts, btn.getAttribute('data-part-down'), 1);
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-scene]').forEach(function (el) {
      el.addEventListener('click', function (ev) {
        if (ev.target.closest('.scene-actions') || ev.target.closest('.scene-done-check')) return;
        state.currentPartId = el.getAttribute('data-scene-part');
        state.currentSceneId = el.getAttribute('data-scene');
        renderTree();
        renderMain();
      });
    });
    wrap.querySelectorAll('[data-scene-done]').forEach(function (checkbox) {
      checkbox.addEventListener('click', function (ev) { ev.stopPropagation(); });
      checkbox.addEventListener('change', function () {
        var partId = checkbox.getAttribute('data-scene-done-part');
        var part = getPart(scenario, partId);
        var scene = getScene(scenario, part, checkbox.getAttribute('data-scene-done'));
        scene.done = checkbox.checked;
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-scene-del]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var sceneId = btn.getAttribute('data-scene-del');
        var partId = btn.getAttribute('data-scene-del-part');
        var part = getPart(scenario, partId);
        var scene = getScene(scenario, part, sceneId);
        if (!confirm('"' + scene.title + '" 씬을 삭제할까요?')) return;
        var idx = part.scenes.findIndex(function (s) { return s.id === sceneId; });
        part.scenes = part.scenes.filter(function (s) { return s.id !== sceneId; });
        if (state.currentSceneId === sceneId) state.currentSceneId = null;
        saveData();
        render();
        showUndoToast('"' + scene.title + '" 씬', function () {
          part.scenes.splice(idx, 0, scene);
          saveData();
          render();
        });
      });
    });
    wrap.querySelectorAll('[data-scene-up]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var part = getPart(scenario, btn.getAttribute('data-scene-up-part'));
        moveInArray(part.scenes, btn.getAttribute('data-scene-up'), -1);
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-scene-down]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var part = getPart(scenario, btn.getAttribute('data-scene-down-part'));
        moveInArray(part.scenes, btn.getAttribute('data-scene-down'), 1);
        saveData();
        renderTree();
      });
    });
    wrap.querySelectorAll('[data-add-scene]').forEach(function (el) {
      el.addEventListener('click', function () {
        var partId = el.getAttribute('data-add-scene');
        var part = getPart(scenario, partId);
        openPrompt('새 씬 이름', '', function (val) {
          if (!val) return;
          var scene = { id: uid(), title: val, blocks: [
            { id: uid(), type: 'text', label: '나레이션', content: '' }
          ] };
          part.scenes.push(scene);
          state.openParts[partId] = true;
          state.currentPartId = partId;
          state.currentSceneId = scene.id;
          saveData();
          render();
        });
      });
    });
    var addPartEl = wrap.querySelector('[data-add-part]');
    if (addPartEl) {
      addPartEl.addEventListener('click', function () {
        openPrompt('새 파트(폴더) 이름', '', function (val) {
          if (!val) return;
          var part = { id: uid(), title: val, scenes: [] };
          scenario.parts.push(part);
          state.openParts[part.id] = true;
          saveData();
          renderTree();
        });
      });
    }
  }

  /* ---------- 메인 패널 ---------- */

  function renderMain() {
    var main = document.getElementById('main');
    if (state.mode === 'timeline') {
      var scenarioTl = getCurrentScenario();
      if (!scenarioTl) {
        main.innerHTML = '<div class="main-empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V4a2 2 0 00-2-2H6.5A2.5 2.5 0 004 4.5v15z" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<h3>시나리오를 선택해주세요</h3>' +
          '<p>왼쪽에서 시나리오를 고르면 전체 흐름을 타임라인으로 볼 수 있어요.</p>' +
          '</div>';
        document.title = '시나리오 대장간';
        return;
      }
      document.title = scenarioTl.title + ' 타임라인 · 시나리오 대장간';
      renderTimelineMode(main, scenarioTl);
      return;
    }
    var scene = getCurrentScene();
    if (!scene) {
      main.innerHTML = '<div class="main-empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V4a2 2 0 00-2-2H6.5A2.5 2.5 0 004 4.5v15z" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<h3>씬을 선택해주세요</h3>' +
        '<p>왼쪽에서 시나리오와 파트를 고르고, 씬을 선택하거나 새로 만들면 여기에 내용이 나타나요.</p>' +
        '</div>';
      document.title = '시나리오 대장간';
      return;
    }
    document.title = scene.title + ' · 시나리오 대장간';
    trackRecentScene(state.currentScenarioId, state.currentPartId, state.currentSceneId);
    if (state.mode === 'edit') renderEditMode(main, scene);
    else renderPlayMode(main, scene);
  }

  function currentPlatform() {
    var sc = getCurrentScenario();
    return sc && getPlatform(sc.platformId);
  }

  var BLOCK_TYPES = {
    truth: { label: '진상', color: '#7a2e3d', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2.6 5.9L21 9l-4.8 4 1.3 6.4L12 16.3 6.5 19.4l1.3-6.4L3 9l6.4-1.1z" stroke-linejoin="round"/></svg>' },
    text: { label: '나레이션', color: 'var(--accent)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>' },
    memo: { label: '키퍼 메모', color: 'var(--gold)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V4a2 2 0 00-2-2H6.5A2.5 2.5 0 004 4.5v15z" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    lines: { label: '대사', color: '#c1622e', icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 8c-2.2 0-4 1.8-4 4 0 2 1.4 3.6 3.3 3.9-.2 1-.9 1.8-2 2.3v1.6c2.6-.4 4.7-2.6 4.7-5.6V8H7zm10 0c-2.2 0-4 1.8-4 4 0 2 1.4 3.6 3.3 3.9-.2 1-.9 1.8-2 2.3v1.6c2.6-.4 4.7-2.6 4.7-5.6V8h-2z"/></svg>' },
    branches: { label: '선택지 분기', color: '#3a5a9c', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 8.4V15.6M8.2 7.3C11 8.6 13 10 15.8 11" stroke-linecap="round"/></svg>' },
    checks: { label: '판정 결과', color: 'var(--danger)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>' },
    npc: { label: 'NPC 카드', color: '#7a4c9c', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1-3.6 4-5.6 7-5.6s6 2 7 5.6" stroke-linecap="round"/></svg>' },
    handout: { label: '핸드아웃', color: '#1f8a8a', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h12l4 4v12H4z" stroke-linejoin="round"/><path d="M16 4v4h4" stroke-linejoin="round"/></svg>' },
    bgm: { label: 'BGM', color: '#c23c7a', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18V5l11-2v13" stroke-linejoin="round"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>' },
    item: { label: '아이템', color: '#8a6d1f', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 00-1-1.7l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.7l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke-linejoin="round"/><path d="M3.3 7l8.7 5 8.7-5M12 22V12" stroke-linejoin="round"/></svg>' },
    place: { label: '장소', color: '#2f6f8a', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4"/></svg>' }
  };

  function renderEditMode(main, scene) {
    var scenario = getCurrentScenario();
    var part = getCurrentPart();
    var platform = currentPlatform();

    var html = '';
    html += '<div class="scene-header">';
    html += '<div style="flex:1; min-width:0;">';
    html += '<div class="breadcrumb">' + escapeHtml(platform ? platform.name : '') + ' / ' + escapeHtml(scenario.title) + ' / ' + escapeHtml(part.title) + '</div>';
    html += '<input type="text" class="scene-title-input" id="scene-title-input" value="' + escapeHtml(scene.title) + '">';
    html += '</div>';
    html += '</div>';

    html += '<div class="command-bar" id="floating-command-bar" hidden></div>';
    html += '<div id="block-list"></div>';
    html += '<div class="add-block-bar">';
    Object.keys(BLOCK_TYPES).forEach(function (type) {
      html += '<button class="add-item-btn add-block-btn" data-add-block="' + type + '" style="width:auto; flex:1;">' + ICONS.plus + ' ' + BLOCK_TYPES[type].label + '</button>';
    });
    html += '</div>';

    main.innerHTML = html;

    document.getElementById('scene-title-input').addEventListener('input', function (e) {
      scene.title = e.target.value;
      saveData();
      renderTree();
    });

    main.querySelectorAll('[data-add-block]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var type = btn.getAttribute('data-add-block');
        var block = { id: uid(), type: type, label: BLOCK_TYPES[type].label };
        if (type === 'text' || type === 'memo' || type === 'truth') block.content = '';
        if (type === 'branches' || type === 'checks' || type === 'lines') block.items = [];
        if (type === 'npc') { block.name = ''; block.imageUrl = ''; block.role = ''; block.traits = ''; block.lines = ''; }
        if (type === 'handout') { block.title = ''; block.content = ''; block.gmNote = ''; }
        if (type === 'bgm') { block.title = ''; block.url = ''; block.note = ''; }
        if (type === 'item' || type === 'place') { block.name = ''; block.imageUrl = ''; block.description = ''; block.gmNote = ''; }
        scene.blocks.push(block);
        saveData();
        renderBlockList(scene, platform);
      });
    });

    renderBlockList(scene, platform);
  }

  function moveBlock(scene, blockId, dir) {
    var i = scene.blocks.findIndex(function (b) { return b.id === blockId; });
    var j = i + dir;
    if (i === -1 || j < 0 || j >= scene.blocks.length) return;
    var tmp = scene.blocks[i];
    scene.blocks[i] = scene.blocks[j];
    scene.blocks[j] = tmp;
    saveData();
  }

  function renderBlockList(scene, platform) {
    var wrap = document.getElementById('block-list');
    var html = '';
    scene.blocks.forEach(function (block, idx) {
      var meta = BLOCK_TYPES[block.type] || BLOCK_TYPES.text;
      html += '<div class="field-block' + (block.indent ? ' is-indented' : '') + '" data-block="' + block.id + '" draggable="true" style="--block-color:' + meta.color + '">';
      html += '<div class="field-label-row">';
      html += '<span class="drag-handle" title="드래그해서 순서 바꾸기">' + ICONS.grip + '</span>';
      html += '<span class="field-label"><span class="block-type-icon" style="--block-color:' + meta.color + '" title="' + escapeHtml(meta.label) + '">' + (meta.icon || '') + '</span>';
      html += '<input class="block-label-input" data-block-label="' + block.id + '" value="' + escapeHtml(block.label) + '"></span>';
      html += '<span class="block-controls">';
      html += '<button class="icon-btn' + (block.indent ? ' is-active' : '') + '" data-block-indent="' + block.id + '" title="들여쓰기 (윗 블록에 딸린 메모처럼)">⇥</button>';
      html += '<button class="icon-btn" data-block-up="' + block.id + '" title="위로" ' + (idx === 0 ? 'disabled' : '') + '>↑</button>';
      html += '<button class="icon-btn" data-block-down="' + block.id + '" title="아래로" ' + (idx === scene.blocks.length - 1 ? 'disabled' : '') + '>↓</button>';
      html += '<button class="icon-btn" data-block-del="' + block.id + '" title="블록 삭제">' + ICONS.trash + '</button>';
      html += '</span>';
      html += '</div>';

      if (block.type === 'text') {
        html += '<textarea class="field-textarea" data-block-content="' + block.id + '" placeholder="여기에 장면 지문, 대사, 묘사를 적어주세요.">' + escapeHtml(block.content) + '</textarea>';
      } else if (block.type === 'memo') {
        html += '<div class="keeper-box"><textarea class="field-textarea" data-block-content="' + block.id + '" placeholder="진행 팁, GM만 알아야 할 정보, 유의사항 등을 적어주세요.">' + escapeHtml(block.content) + '</textarea></div>';
      } else if (block.type === 'truth') {
        html += '<div class="truth-box"><textarea class="field-textarea" data-block-content="' + block.id + '" placeholder="이 시나리오의 진짜 전말, 사건의 진상을 적어주세요. (GM 전용)">' + escapeHtml(block.content) + '</textarea></div>';
      } else if (block.type === 'branches') {
        html += '<div data-branch-wrap="' + block.id + '"></div>';
        html += '<button class="add-item-btn" data-add-branch="' + block.id + '">' + ICONS.plus + ' 분기 추가</button>';
      } else if (block.type === 'lines') {
        html += '<div data-line-wrap="' + block.id + '"></div>';
        html += '<button class="add-item-btn" data-add-line="' + block.id + '">' + ICONS.plus + ' 대사 추가</button>';
      } else if (block.type === 'checks') {
        html += '<div data-check-wrap="' + block.id + '"></div>';
        html += '<button class="add-item-btn" data-add-check="' + block.id + '">' + ICONS.plus + ' 판정 항목 추가</button>';
      } else if (block.type === 'npc') {
        html += '<div class="npc-form" data-npc-form="' + block.id + '">';
        html += '<div class="npc-form-row">';
        html += '<div class="npc-avatar-edit"><img data-npc-preview="' + block.id + '" src="' + escapeHtml(block.imageUrl) + '" onerror="this.style.display=\'none\'"></div>';
        html += '<div class="npc-form-fields">';
        html += '<input type="text" data-npc-name="' + block.id + '" placeholder="NPC 이름" value="' + escapeHtml(block.name) + '">';
        html += '<input type="text" data-npc-role="' + block.id + '" placeholder="역할 / 한 줄 소개 (예: 등대지기, 수상한 노인)" value="' + escapeHtml(block.role) + '">';
        html += '<input type="text" data-npc-image="' + block.id + '" placeholder="이미지 URL (선택)" value="' + escapeHtml(block.imageUrl) + '">';
        html += '</div></div>';
        html += '<label class="npc-sub-label">특징 (한 줄에 하나씩)</label>';
        html += '<textarea data-npc-traits="' + block.id + '" placeholder="예&#10;왼쪽 눈에 안대를 하고 있다&#10;말투가 유독 정중하다">' + escapeHtml(block.traits) + '</textarea>';
        html += '<label class="npc-sub-label">대사 예시 (한 줄에 하나씩)</label>';
        html += '<textarea data-npc-lines="' + block.id + '" placeholder="예&#10;&quot;등대엔 함부로 들어가지 않는 게 좋을 텐데.&quot;">' + escapeHtml(block.lines) + '</textarea>';
        html += '</div>';
      } else if (block.type === 'handout') {
        html += '<div class="npc-form" data-handout-form="' + block.id + '">';
        html += '<label class="npc-sub-label" style="margin-top:0;">핸드아웃 제목</label>';
        html += '<input type="text" data-handout-title="' + block.id + '" placeholder="예: 낡은 항해일지" value="' + escapeHtml(block.title) + '">';
        html += '<label class="npc-sub-label">내용</label>';
        html += '<textarea data-handout-content="' + block.id + '" placeholder="편지, 신문기사, 사진 설명 등 플레이어에게 그대로 보여줄 텍스트">' + escapeHtml(block.content) + '</textarea>';
        html += '<label class="npc-sub-label">GM 전용 메모</label>';
        html += '<textarea data-handout-gmnote="' + block.id + '" class="handout-gmnote" placeholder="이 핸드아웃과 관련해서 GM만 알아야 할 정보">' + escapeHtml(block.gmNote) + '</textarea>';
        html += '</div>';
      } else if (block.type === 'item' || block.type === 'place') {
        html += '<div class="npc-form" data-entity-form="' + block.id + '">';
