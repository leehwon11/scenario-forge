  /* ---------- 찾기·바꾸기 ---------- */

  function collectTextRefs() {
    // { get, set } 형태로 모든 텍스트 필드에 대한 참조 목록을 만든다
    var refs = [];
    state.data.scenarios.forEach(function (scenario) {
      scenario.parts.forEach(function (part) {
        part.scenes.forEach(function (scene) {
          (scene.blocks || []).forEach(function (block) {
            if (block.type === 'text' || block.type === 'memo' || block.type === 'truth') {
              refs.push({ get: function () { return block.content; }, set: function (v) { block.content = v; } });
            } else if (block.type === 'branches' || block.type === 'lines') {
              block.items.forEach(function (b) {
                refs.push({ get: function () { return b.label; }, set: function (v) { b.label = v; } });
                refs.push({ get: function () { return b.text; }, set: function (v) { b.text = v; } });
              });
            } else if (block.type === 'checks') {
              block.items.forEach(function (c) {
                refs.push({ get: function () { return c.name; }, set: function (v) { c.name = v; } });
                ['critSuccess', 'success', 'fail', 'critFail'].forEach(function (k) {
                  refs.push({ get: function () { return c[k]; }, set: function (v) { c[k] = v; } });
                });
              });
            } else if (block.type === 'npc') {
              ['name', 'role', 'traits', 'lines'].forEach(function (k) {
                refs.push({ get: function () { return block[k]; }, set: function (v) { block[k] = v; } });
              });
            } else if (block.type === 'handout') {
              ['title', 'content', 'gmNote'].forEach(function (k) {
                refs.push({ get: function () { return block[k]; }, set: function (v) { block[k] = v; } });
              });
            } else if (block.type === 'bgm') {
              ['title', 'note'].forEach(function (k) {
                refs.push({ get: function () { return block[k]; }, set: function (v) { block[k] = v; } });
              });
            }
          });
        });
      });
    });
    return refs;
  }

  function countMatches(term) {
    if (!term) return 0;
    var refs = collectTextRefs();
    var total = 0;
    refs.forEach(function (r) {
      var v = r.get() || '';
      var idx = 0;
      while (true) {
        idx = v.indexOf(term, idx);
        if (idx === -1) break;
        total++;
        idx += term.length;
      }
    });
    return total;
  }

  function applyReplace(term, replacement) {
    var refs = collectTextRefs();
    var changed = 0;
    refs.forEach(function (r) {
      var v = r.get() || '';
      if (v.indexOf(term) !== -1) {
        r.set(v.split(term).join(replacement));
        changed++;
      }
    });
    saveData();
    return changed;
  }

  function openReplaceModal() {
    var modal = document.getElementById('replace-modal');
    var findInput = document.getElementById('find-input');
    var replaceInput = document.getElementById('replace-input');
    var preview = document.getElementById('replace-preview');
    findInput.value = ''; replaceInput.value = '';
    preview.innerHTML = '검색어를 입력하면 몇 건 발견됐는지 여기 보여드려요.';
    modal.hidden = false;
    setTimeout(function () { findInput.focus(); }, 30);

    function updatePreview() {
      var term = findInput.value;
      if (!term) { preview.innerHTML = '검색어를 입력하면 몇 건 발견됐는지 여기 보여드려요.'; return; }
      var n = countMatches(term);
      preview.innerHTML = '전체 시나리오에서 <b>' + n + '건</b> 발견됐어요.';
    }
    findInput.addEventListener('input', updatePreview);

    function close() { modal.hidden = true; cleanup(); }
    function ok() {
      var term = findInput.value;
      if (!term) { showToast('찾을 단어를 입력해주세요'); return; }
      var n = countMatches(term);
      if (!n) { showToast('일치하는 내용이 없어요'); return; }
      if (!confirm(n + '건을 모두 바꿀까요? 되돌릴 수 없어요.')) return;
      var changed = applyReplace(term, replaceInput.value);
      close();
      render();
      showToast(changed + '개 항목에서 바꿨어요');
    }
    function cleanup() {
      findInput.removeEventListener('input', updatePreview);
      document.getElementById('replace-modal-close').removeEventListener('click', close);
      document.getElementById('replace-modal-cancel').removeEventListener('click', close);
      document.getElementById('replace-modal-ok').removeEventListener('click', ok);
    }
    document.getElementById('replace-modal-close').addEventListener('click', close);
    document.getElementById('replace-modal-cancel').addEventListener('click', close);
    document.getElementById('replace-modal-ok').addEventListener('click', ok);
  }

  /* ---------- 내보내기 / 불러오기 / 초기화 ---------- */

  function exportData() {
    var blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'scenario-forge-backup-' + date + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('JSON 파일로 내보냈어요');
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.platforms) || !Array.isArray(parsed.scenarios)) {
          throw new Error('형식 오류');
        }
        if (!confirm('불러온 파일로 현재 데이터를 덮어씌울까요? 지금 데이터는 사라져요.')) return;
        migrateData(parsed);
        state.data = parsed;
        state.currentPlatformId = null;
        state.currentScenarioId = null;
        state.currentPartId = null;
        state.currentSceneId = null;
        state.openParts = {};
        ensureSelection();
        saveData();
        render();
        showToast('불러오기 완료');
      } catch (e) {
        alert('올바른 시나리오 대장간 JSON 파일이 아니에요.');
      }
    };
    reader.readAsText(file);
  }

  function resetAll() {
    if (!confirm('모든 시나리오, 사이트, 명령어를 전부 초기화할까요? 이 작업은 되돌릴 수 없어요.')) return;
    if (!confirm('정말로 전체 초기화하시겠어요? 마지막 확인이에요.')) return;
    state.data = { platforms: [], scenarios: [] };
    state.currentPlatformId = null;
    state.currentScenarioId = null;
    state.currentPartId = null;
    state.currentSceneId = null;
    state.openParts = {};
    saveData();
    render();
    showToast('전체 초기화했어요');
  }

  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', function () {
    document.getElementById('import-file-input').click();
  });
  document.getElementById('import-file-input').addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('reset-btn').addEventListener('click', resetAll);

  var sidebarToggle = document.getElementById('sidebar-toggle-btn');
  function syncMobileToggle() {
    var isMobile = window.innerWidth <= 860;
    sidebarToggle.style.display = isMobile ? 'inline-flex' : 'none';
  }
  window.addEventListener('resize', syncMobileToggle);
  syncMobileToggle();
  sidebarToggle.addEventListener('click', function () {
    document.getElementById('sidebar').classList.toggle('is-open');
  });

  /* ---------- 입력칸 자동 높이 조정 ---------- */
  document.addEventListener('input', function (e) {
    if (e.target && e.target.tagName === 'TEXTAREA') autoResizeTextarea(e.target);
  });

  /* ---------- 단축키 ---------- */
  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    if (e.key === 's' || e.key === 'S') {
      e.preventDefault();
      saveData();
      showToast('저장됨');
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      openReplaceModal();
    }
  });

  /* ================= 초기 실행 ================= */
  ensureSelection();
  render();
  updateSaveIndicator();
})();
</script>
</body>
</html>
