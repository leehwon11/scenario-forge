        html += '<div class="npc-form-row">';
        html += '<div class="npc-avatar-edit"><img data-entity-preview="' + block.id + '" src="' + escapeHtml(block.imageUrl) + '" onerror="this.style.display=\'none\'"></div>';
        html += '<div class="npc-form-fields">';
        html += '<input type="text" data-entity-name="' + block.id + '" placeholder="' + (block.type === 'item' ? '아이템 이름' : '장소 이름') + '" value="' + escapeHtml(block.name) + '">';
        html += '<input type="text" data-entity-image="' + block.id + '" placeholder="이미지 URL (선택)" value="' + escapeHtml(block.imageUrl) + '">';
        html += '</div></div>';
        html += '<label class="npc-sub-label">설명</label>';
        html += '<textarea data-entity-description="' + block.id + '" placeholder="' + (block.type === 'item' ? '겉보기 특징, 플레이어에게 보여줄 설명' : '장소의 분위기, 플레이어에게 보여줄 설명') + '">' + escapeHtml(block.description) + '</textarea>';
        html += '<label class="npc-sub-label">GM 전용 메모</label>';
        html += '<textarea data-entity-gmnote="' + block.id + '" class="handout-gmnote" placeholder="' + (block.type === 'item' ? '진짜 정체, 숨겨진 효과 등' : '숨겨진 진상, 함정, 단서 등') + '">' + escapeHtml(block.gmNote) + '</textarea>';
        html += '</div>';
      } else if (block.type === 'bgm') {
        html += '<div class="npc-form" data-bgm-form="' + block.id + '">';
        html += '<label class="npc-sub-label" style="margin-top:0;">트랙 이름</label>';
        html += '<input type="text" data-bgm-title="' + block.id + '" placeholder="예: 등대 진입 - 긴장감" value="' + escapeHtml(block.title) + '">';
        html += '<label class="npc-sub-label">링크 (유튜브 또는 음원 파일 URL)</label>';
        html += '<input type="text" data-bgm-url="' + block.id + '" placeholder="https://youtube.com/watch?v=... 또는 https://.../track.mp3" value="' + escapeHtml(block.url) + '">';
        html += '<label class="npc-sub-label">재생 메모 (타이밍, 볼륨 등)</label>';
        html += '<textarea data-bgm-note="' + block.id + '" placeholder="예: 문을 여는 순간부터 재생, 볼륨은 낮게">' + escapeHtml(block.note) + '</textarea>';
        html += '</div>';
      }

      html += '</div>';
    });
    if (!scene.blocks.length) {
      html = '<div class="tree-empty" style="text-align:left; padding:20px 0;">아직 블록이 없어요. 아래 버튼으로 원하는 순서대로 추가해보세요.</div>';
    }
    wrap.innerHTML = html;

    // 드래그앤드롭으로 블록 순서 변경
    var draggedId = null;
    wrap.querySelectorAll('.field-block[data-block]').forEach(function (el) {
      el.addEventListener('dragstart', function (e) {
        draggedId = el.getAttribute('data-block');
        el.classList.add('is-dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', draggedId);
        }
      });
      el.addEventListener('dragend', function () {
        el.classList.remove('is-dragging');
        wrap.querySelectorAll('.field-block').forEach(function (b) { b.classList.remove('is-drag-over'); });
      });
      el.addEventListener('dragover', function (e) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        if (draggedId && el.getAttribute('data-block') !== draggedId) el.classList.add('is-drag-over');
      });
      el.addEventListener('dragleave', function () {
        el.classList.remove('is-drag-over');
      });
      el.addEventListener('drop', function (e) {
        e.preventDefault();
        el.classList.remove('is-drag-over');
        var targetId = el.getAttribute('data-block');
        if (!draggedId || draggedId === targetId) return;
        var fromIdx = scene.blocks.findIndex(function (b) { return b.id === draggedId; });
        var toIdx = scene.blocks.findIndex(function (b) { return b.id === targetId; });
        if (fromIdx === -1 || toIdx === -1) return;
        var moved = scene.blocks.splice(fromIdx, 1)[0];
        scene.blocks.splice(toIdx, 0, moved);
        saveData();
        renderBlockList(scene, platform);
      });
    });

    // 라벨/이동/삭제
    wrap.querySelectorAll('[data-block-label]').forEach(function (input) {
      input.addEventListener('input', function () {
        findBlock(scene, input.getAttribute('data-block-label')).label = input.value;
        saveData();
      });
    });
    wrap.querySelectorAll('[data-block-indent]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var block = findBlock(scene, btn.getAttribute('data-block-indent'));
        block.indent = !block.indent;
        saveData();
        renderBlockList(scene, platform);
      });
    });
    wrap.querySelectorAll('[data-block-up]').forEach(function (btn) {
      btn.addEventListener('click', function () { moveBlock(scene, btn.getAttribute('data-block-up'), -1); renderBlockList(scene, platform); });
    });
    wrap.querySelectorAll('[data-block-down]').forEach(function (btn) {
      btn.addEventListener('click', function () { moveBlock(scene, btn.getAttribute('data-block-down'), 1); renderBlockList(scene, platform); });
    });
    wrap.querySelectorAll('[data-block-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-block-del');
        if (!confirm('이 블록을 삭제할까요?')) return;
        var idx = scene.blocks.findIndex(function (b) { return b.id === id; });
        var removed = scene.blocks[idx];
        scene.blocks = scene.blocks.filter(function (b) { return b.id !== id; });
        saveData();
        renderBlockList(scene, platform);
        var typeLabel = (BLOCK_TYPES[removed.type] || {}).label || '블록';
        showUndoToast(typeLabel + ' 블록', function () {
          scene.blocks.splice(idx, 0, removed);
          saveData();
          renderBlockList(scene, platform);
        });
      });
    });

    // 텍스트/메모 입력
    wrap.querySelectorAll('[data-block-content]').forEach(function (ta) {
      ta.addEventListener('input', function () {
        findBlock(scene, ta.getAttribute('data-block-content')).content = ta.value;
        saveData();
      });
    });

    // NPC 카드 입력
    ['name', 'role', 'traits', 'lines'].forEach(function (key) {
      wrap.querySelectorAll('[data-npc-' + key + ']').forEach(function (input) {
        input.addEventListener('input', function () {
          findBlock(scene, input.getAttribute('data-npc-' + key))[key] = input.value;
          saveData();
        });
      });
    });
    wrap.querySelectorAll('[data-npc-image]').forEach(function (input) {
      input.addEventListener('input', function () {
        var block = findBlock(scene, input.getAttribute('data-npc-image'));
        block.imageUrl = input.value;
        saveData();
        var preview = wrap.querySelector('[data-npc-preview="' + block.id + '"]');
        if (preview) { preview.src = input.value; preview.style.display = ''; }
      });
    });

    // 핸드아웃 입력
    ['title', 'content', 'gmNote'].forEach(function (key) {
      wrap.querySelectorAll('[data-handout-' + (key === 'gmNote' ? 'gmnote' : key) + ']').forEach(function (input) {
        input.addEventListener('input', function () {
          findBlock(scene, input.getAttribute('data-handout-' + (key === 'gmNote' ? 'gmnote' : key)))[key] = input.value;
          saveData();
        });
      });
    });

    // BGM 입력
    ['title', 'url', 'note'].forEach(function (key) {
      wrap.querySelectorAll('[data-bgm-' + key + ']').forEach(function (input) {
        input.addEventListener('input', function () {
          findBlock(scene, input.getAttribute('data-bgm-' + key))[key] = input.value;
          saveData();
        });
      });
    });

    // 아이템 / 장소 입력
    wrap.querySelectorAll('[data-entity-name]').forEach(function (input) {
      input.addEventListener('input', function () {
        findBlock(scene, input.getAttribute('data-entity-name')).name = input.value;
        saveData();
      });
    });
    wrap.querySelectorAll('[data-entity-description]').forEach(function (input) {
      input.addEventListener('input', function () {
        findBlock(scene, input.getAttribute('data-entity-description')).description = input.value;
        saveData();
      });
    });
    wrap.querySelectorAll('[data-entity-gmnote]').forEach(function (input) {
      input.addEventListener('input', function () {
        findBlock(scene, input.getAttribute('data-entity-gmnote')).gmNote = input.value;
        saveData();
      });
    });
    wrap.querySelectorAll('[data-entity-image]').forEach(function (input) {
      input.addEventListener('input', function () {
        var block = findBlock(scene, input.getAttribute('data-entity-image'));
        block.imageUrl = input.value;
        saveData();
        var preview = wrap.querySelector('[data-entity-preview="' + block.id + '"]');
        if (preview) { preview.src = input.value; preview.style.display = ''; }
      });
    });

    // 명령어 바: 지금 클릭(포커스)한 칸 바로 위로 옮겨다님
    var floatBar = document.getElementById('floating-command-bar');
    function renderFloatBarContent() {
      if (!floatBar) return;
      if (platform && platform.commands.length) {
        var cbHtml = '';
        platform.commands.forEach(function (c) {
          cbHtml += '<button class="command-chip" data-snippet="' + escapeHtml(c.snippet) + '">' + escapeHtml(c.label) + '</button>';
        });
        cbHtml += '<button class="command-chip-manage" id="floating-command-manage">+ 관리</button>';
        floatBar.innerHTML = cbHtml;
      } else {
        floatBar.innerHTML = '<button class="command-chip-manage" id="floating-command-manage">+ 이 사이트의 명령어 등록하기</button>';
      }
      floatBar.querySelectorAll('[data-snippet]').forEach(function (btn) {
        btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        btn.addEventListener('click', function () {
          if (state.globalLastFocusedField) insertAtCursor(state.globalLastFocusedField, btn.getAttribute('data-snippet'));
        });
      });
      var manageBtn = document.getElementById('floating-command-manage');
      if (manageBtn) {
        manageBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        manageBtn.addEventListener('click', openCommandModal);
      }
    }
    renderFloatBarContent();

    if (!wrap.dataset.focusBound) {
      wrap.dataset.focusBound = '1';
      var hideTimer = null;

      function positionFloatingBar(bar, target) {
        var r = target.getBoundingClientRect();
        var topbarEl = document.querySelector('.topbar');
        var minTop = (topbarEl ? topbarEl.getBoundingClientRect().bottom : 0) + 6;
        var barH = bar.offsetHeight || 40;
        bar.style.position = 'fixed';
        var left = Math.round(r.left);
        var width = Math.round(r.width);
        var maxLeft = window.innerWidth - width - 8;
        if (left > maxLeft) left = Math.max(8, maxLeft);
        bar.style.left = left + 'px';
        bar.style.width = width + 'px';
        var topAbove = r.top - barH - 6;
        var top;
        if (topAbove >= minTop) {
          // 입력칸 위에 놓을 공간이 충분하면 위에 배치
          top = topAbove;
        } else {
          // 공간이 부족하면 입력칸 아래로 배치해 가리지 않게 함
          top = Math.min(r.bottom + 6, window.innerHeight - barH - 8);
          bar.classList.add('is-below');
        }
        if (topAbove >= minTop) bar.classList.remove('is-below');
        top = Math.max(minTop, top);
        bar.style.top = Math.round(top) + 'px';
      }

      wrap.addEventListener('focusin', function (e) {
        var target = e.target;
        var isField = target.tagName === 'TEXTAREA' || (target.tagName === 'INPUT' && target.type === 'text' && !target.classList.contains('block-label-input'));
        if (!isField) return;
        clearTimeout(hideTimer);
        state.globalLastFocusedField = target;
        var bar = document.getElementById('floating-command-bar');
        if (!bar) return;
        bar.hidden = false;
        positionFloatingBar(bar, target);
      });

      wrap.addEventListener('focusout', function (e) {
        var isField = e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && e.target.type === 'text');
        if (!isField) return;
        hideTimer = setTimeout(function () {
          var bar = document.getElementById('floating-command-bar');
          if (bar) bar.hidden = true;
        }, 150);
      });

      document.getElementById('main').addEventListener('scroll', function () {
        var bar = document.getElementById('floating-command-bar');
        if (bar && !bar.hidden && state.globalLastFocusedField && wrap.contains(state.globalLastFocusedField)) {
          positionFloatingBar(bar, state.globalLastFocusedField);
        }
      });
    }

    // 분기 / 판정 / 대사 블록
    scene.blocks.forEach(function (block) {
      if (block.type === 'branches') renderBranchList(scene, block);
      if (block.type === 'checks') renderCheckList(scene, block);
      if (block.type === 'lines') renderLineList(scene, block);
    });
    wrap.querySelectorAll('[data-add-branch]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var block = findBlock(scene, btn.getAttribute('data-add-branch'));
        block.items.push({ id: uid(), label: '', text: '' });
        saveData();
        renderBranchList(scene, block);
      });
    });
    wrap.querySelectorAll('[data-add-line]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var block = findBlock(scene, btn.getAttribute('data-add-line'));
        block.items.push({ id: uid(), label: '', text: '' });
        saveData();
        renderLineList(scene, block);
      });
    });
    wrap.querySelectorAll('[data-add-check]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var block = findBlock(scene, btn.getAttribute('data-add-check'));
        block.items.push({ id: uid(), name: '', critSuccess: '', success: '', fail: '', critFail: '' });
        saveData();
        renderCheckList(scene, block);
        autoResizeAllTextareas(wrap);
      });
    });

    autoResizeAllTextareas(wrap);
  }

  function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }

  function autoResizeAllTextareas(root) {
    (root || document).querySelectorAll('textarea').forEach(autoResizeTextarea);
  }

  function findBlock(scene, id) { return scene.blocks.find(function (b) { return b.id === id; }); }

  function renderBranchList(scene, block) {
    var wrap = document.querySelector('[data-branch-wrap="' + block.id + '"]');
    if (!wrap) return;
    var html = '';
    block.items.forEach(function (b) {
      html += '<div class="item-card item-card-branch" data-branch="' + b.id + '">';
      html += '<div class="item-card-head">';
      html += '<input class="mini-input" data-branch-label="' + b.id + '" placeholder="선택지 (예: 문을 두드린다)" value="' + escapeHtml(b.label) + '">';
      html += '<button class="remove-btn" data-branch-del="' + b.id + '">' + ICONS.trash + '</button>';
      html += '</div>';
      html += '<textarea data-branch-text="' + b.id + '" placeholder="이 선택지를 골랐을 때의 전개">' + escapeHtml(b.text) + '</textarea>';
      html += '</div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('textarea[data-branch-text]').forEach(function (t) {
      t.style.cssText = 'width:100%; border:1px solid var(--line); border-radius:5px; padding:8px 9px; font-size:12.5px; min-height:40px; resize:none; overflow:hidden; outline:none;';
    });

    wrap.querySelectorAll('[data-branch-label]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-branch-label')).label = input.value; saveData();
      });
    });
    wrap.querySelectorAll('[data-branch-text]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-branch-text')).text = input.value; saveData();
      });
    });
    wrap.querySelectorAll('[data-branch-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        block.items = block.items.filter(function (b) { return b.id !== btn.getAttribute('data-branch-del'); });
        saveData();
        renderBranchList(scene, block);
      });
    });
    autoResizeAllTextareas(wrap);
  }
  function findItem(block, id) { return block.items.find(function (i) { return i.id === id; }); }

  function renderLineList(scene, block) {
    var wrap = document.querySelector('[data-line-wrap="' + block.id + '"]');
    if (!wrap) return;
    var html = '';
    block.items.forEach(function (b) {
      html += '<div class="item-card item-card-line" data-line="' + b.id + '">';
      html += '<div class="item-card-head">';
      html += '<input class="mini-input" data-line-label="' + b.id + '" placeholder="화자 (예: 등대지기, 나레이션 — 생략 가능)" value="' + escapeHtml(b.label) + '">';
      html += '<button class="remove-btn" data-line-del="' + b.id + '">' + ICONS.trash + '</button>';
      html += '</div>';
      html += '<textarea data-line-text="' + b.id + '" placeholder="반드시 전달해야 하는 대사 내용">' + escapeHtml(b.text) + '</textarea>';
      html += '</div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('textarea[data-line-text]').forEach(function (t) {
      t.style.cssText = 'width:100%; border:1px solid var(--line); border-radius:5px; padding:8px 9px; font-size:12.5px; min-height:40px; resize:none; overflow:hidden; outline:none;';
    });

    wrap.querySelectorAll('[data-line-label]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-line-label')).label = input.value; saveData();
      });
    });
    wrap.querySelectorAll('[data-line-text]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-line-text')).text = input.value; saveData();
      });
    });
    wrap.querySelectorAll('[data-line-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        block.items = block.items.filter(function (b) { return b.id !== btn.getAttribute('data-line-del'); });
        saveData();
        renderLineList(scene, block);
      });
    });
    autoResizeAllTextareas(wrap);
  }

  function renderCheckList(scene, block) {
    var wrap = document.querySelector('[data-check-wrap="' + block.id + '"]');
    if (!wrap) return;
    var html = '';
    block.items.forEach(function (c) {
      html += '<div class="item-card item-card-check" data-check="' + c.id + '">';
      html += '<div class="item-card-head">';
      html += '<input class="mini-input" data-check-name="' + c.id + '" placeholder="판정명 (예: 감정, 도서관 이용, HP)" value="' + escapeHtml(c.name) + '">';
      html += '<button class="remove-btn" data-check-del="' + c.id + '">' + ICONS.trash + '</button>';
      html += '</div>';
      html += '<div class="outcome-grid">';
      html += outcomeField(c.id, 'critSuccess', 'crit-success', '대성공', c.critSuccess);
      html += outcomeField(c.id, 'success', 'success', '성공', c.success);
      html += outcomeField(c.id, 'fail', 'fail', '실패', c.fail);
      html += outcomeField(c.id, 'critFail', 'crit-fail', '대실패', c.critFail);
      html += '</div>';
      html += '</div>';
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-check-name]').forEach(function (input) {
      input.addEventListener('input', function () {
        findItem(block, input.getAttribute('data-check-name')).name = input.value; saveData();
      });
    });
    ['critSuccess', 'success', 'fail', 'critFail'].forEach(function (key) {
      wrap.querySelectorAll('[data-check-' + key + ']').forEach(function (input) {
        input.addEventListener('input', function () {
          findItem(block, input.getAttribute('data-check-' + key))[key] = input.value; saveData();
        });
      });
    });
    wrap.querySelectorAll('[data-check-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        block.items = block.items.filter(function (c) { return c.id !== btn.getAttribute('data-check-del'); });
        saveData();
        renderCheckList(scene, block);
      });
    });
    autoResizeAllTextareas(wrap);
  }

  function outcomeField(checkId, key, cls, label, value) {
    return '<div class="outcome-field ' + cls + '">' +
      '<span class="outcome-label ' + cls + '">' + label + '</span>' +
      '<textarea data-check-' + key + '="' + checkId + '">' + escapeHtml(value) + '</textarea>' +
      '</div>';
  }

  /* ---------- 플레이 모드 ---------- */

  function renderPlayMode(main, scene) {
    var scenario = getCurrentScenario();
    var part = getCurrentPart();
    var platform = currentPlatform();

    var html = '';
    html += '<div class="scene-header">';
    html += '<div style="flex:1; min-width:0;">';
    html += '<div class="breadcrumb">' + escapeHtml(platform ? platform.name : '') + ' / ' + escapeHtml(scenario.title) + ' / ' + escapeHtml(part.title) + '</div>';
    html += '<h1 class="scene-play-title">' + escapeHtml(scene.title) + '</h1>';
    html += '</div>';
    html += '<div class="scene-header-actions"><button class="copy-btn" data-copy-all>' + ICONS.copy + ' 전체 복사</button></div>';
    html += '</div>';

    scene.blocks.forEach(function (block) {
      var meta = BLOCK_TYPES[block.type] || BLOCK_TYPES.text;
      var indentCls = block.indent ? ' is-indented' : '';
      if (block.type === 'text' || block.type === 'memo' || block.type === 'truth') {
        var extraCls = block.type === 'memo' ? ' keeper-box' : block.type === 'truth' ? ' truth-box' : '';
        html += '<div class="field-block' + extraCls + indentCls + '">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span><button class="copy-btn" data-copy-block="' + block.id + '">' + ICONS.copy + ' 전체 복사</button></div>';
        html += renderTextPlayBox(block.content);
        html += '</div>';
      } else if (block.type === 'branches' && block.items.length) {
        html += '<div class="field-block' + indentCls + '">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        block.items.forEach(function (b) {
          html += '<div class="play-item-card play-item-card-branch" style="border-left-color:' + meta.color + ';">';
          html += '<div class="play-item-title"><span>' + ICONS.branch + escapeHtml(b.label || '(제목 없음)') + '</span><button class="copy-btn" data-copy-raw="' + escapeHtml(b.text) + '">' + ICONS.copy + ' 전체</button></div>';
          html += '<div class="play-item-body text-lines">' + renderLinesInline(b.text) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      } else if (block.type === 'lines' && block.items.length) {
        html += '<div class="field-block' + indentCls + '">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        block.items.forEach(function (b) {
          html += '<div class="play-item-card play-item-card-line" style="border-left-color:' + meta.color + ';">';
          html += '<div class="play-item-title"><span>' + ICONS.quote + (b.label ? escapeHtml(b.label) : '&nbsp;') + '</span><button class="copy-btn" data-copy-raw="' + escapeHtml(b.text) + '">' + ICONS.copy + ' 전체</button></div>';
          html += '<div class="play-item-body text-lines" style="font-style:italic;">' + renderLinesInline(b.text) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      } else if (block.type === 'checks' && block.items.length) {
        html += '<div class="field-block' + indentCls + '">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        block.items.forEach(function (c) {
          html += '<div class="play-item-card play-item-card-check" style="border-left-color:' + meta.color + ';">';
          html += '<div class="play-item-title"><span>' + ICONS.dice + escapeHtml(c.name || '(판정명 없음)') + '</span></div>';
          html += outcomeRow('crit-success', '대성공', c.critSuccess);
          html += outcomeRow('success', '성공', c.success);
          html += outcomeRow('fail', '실패', c.fail);
          html += outcomeRow('crit-fail', '대실패', c.critFail);
          html += '</div>';
        });
        html += '</div>';
      } else if (block.type === 'npc') {
        html += '<div class="field-block' + indentCls + '">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        html += '<div class="npc-play-card">';
        html += '<div class="npc-play-head">';
        if (block.imageUrl) html += '<img class="npc-play-avatar" src="' + escapeHtml(block.imageUrl) + '" onerror="this.style.display=\'none\'">';
        else html += '<div class="npc-play-avatar npc-play-avatar-empty"></div>';
        html += '<div><div class="npc-play-name">' + escapeHtml(block.name || '(이름 없음)') + '</div>';
        if (block.role) html += '<div class="npc-play-role">' + escapeHtml(block.role) + '</div>';
        html += '</div></div>';
        var traitLines = (block.traits || '').split('\n').filter(function (l) { return l.trim(); });
        if (traitLines.length) {
          html += '<ul class="npc-play-traits">';
          traitLines.forEach(function (t) { html += '<li>' + escapeHtml(t) + '</li>'; });
          html += '</ul>';
        }
        var dialogueLines = (block.lines || '').split('\n').filter(function (l) { return l.trim(); });
        if (dialogueLines.length) {
          dialogueLines.forEach(function (l) {
            html += '<div class="npc-play-line"><span>' + escapeHtml(l) + '</span><button class="copy-btn" data-copy-raw="' + escapeHtml(l) + '">' + ICONS.copy + '</button></div>';
          });
        }
        html += '</div></div>';
      } else if (block.type === 'handout') {
        html += '<div class="field-block' + indentCls + '">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span>';
        if (block.content) html += '<button class="copy-btn" data-copy-block="' + block.id + '">' + ICONS.copy + ' 복사</button>';
        html += '</div>';
        html += '<div class="handout-play-card">';
        if (block.title) html += '<div class="handout-play-title">' + escapeHtml(block.title) + '</div>';
        if (block.content) html += '<div class="handout-play-content">' + escapeHtml(block.content) + '</div>';
        if (!block.content && !block.title) html += '<div class="field-play-box is-empty"></div>';
        html += '</div>';
        if (block.gmNote) {
          html += '<div class="handout-gmnote-play"><span class="handout-gmnote-tag">GM 전용</span>' + escapeHtml(block.gmNote) + '</div>';
        }
        html += '</div>';
      } else if (block.type === 'item' || block.type === 'place') {
        html += '<div class="field-block' + indentCls + '">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        html += '<div class="npc-play-card">';
        html += '<div class="npc-play-head">';
        if (block.imageUrl) html += '<img class="npc-play-avatar" style="border-radius:8px;" src="' + escapeHtml(block.imageUrl) + '" onerror="this.style.display=\'none\'">';
        else html += '<div class="npc-play-avatar npc-play-avatar-empty" style="border-radius:8px;"></div>';
        html += '<div><div class="npc-play-name">' + escapeHtml(block.name || (block.type === 'item' ? '(아이템 이름 없음)' : '(장소 이름 없음)')) + '</div></div>';
        html += '</div>';
        if (block.description) html += '<div class="field-play-box text-lines" style="margin-top:8px;">' + renderLinesInline(block.description) + '</div>';
        if (block.gmNote) html += '<div class="handout-gmnote-play"><span class="handout-gmnote-tag">GM 전용</span>' + escapeHtml(block.gmNote) + '</div>';
        html += '</div></div>';
      } else if (block.type === 'bgm') {
        var ytId = getYoutubeId(block.url);
        html += '<div class="field-block' + indentCls + '">';
        html += '<div class="field-label-row"><span class="field-label"><span class="swatch" style="background:' + meta.color + '"></span>' + escapeHtml(block.label) + '</span></div>';
        html += '<div class="bgm-play-card">';
        html += '<div class="bgm-play-head"><span class="bgm-play-note-icon">♪</span><span class="bgm-play-title">' + escapeHtml(block.title || '(제목 없음)') + '</span>';
        if (block.url) html += '<a class="copy-btn" href="' + escapeHtml(block.url) + '" target="_blank" rel="noopener">↗ 열기</a>';
        html += '</div>';
        if (ytId) {
          html += '<div class="bgm-yt-wrap"><iframe src="https://www.youtube.com/embed/' + ytId + '" title="BGM" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>';
        } else if (isAudioFileUrl(block.url)) {
          html += '<audio controls src="' + escapeHtml(block.url) + '" style="width:100%; margin-top:8px;"></audio>';
        }
        if (block.note) html += '<div class="bgm-play-note">' + escapeHtml(block.note) + '</div>';
        html += '</div></div>';
      }
    });

    // 이전 / 다음 씬 네비게이션
    var flat = getFlatSceneList(scenario);
    var curIdx = flat.findIndex(function (f) { return f.sceneId === scene.id; });
    var prevItem = curIdx > 0 ? flat[curIdx - 1] : null;
    var nextItem = curIdx > -1 && curIdx < flat.length - 1 ? flat[curIdx + 1] : null;
    if (prevItem || nextItem) {
      html += '<div class="scene-nav">';
      html += prevItem
        ? '<button class="scene-nav-btn scene-nav-prev" data-nav-part="' + prevItem.partId + '" data-nav-scene="' + prevItem.sceneId + '"><span class="scene-nav-dir">← 이전 씬</span><span class="scene-nav-title">' + escapeHtml(prevItem.sceneTitle) + '</span></button>'
        : '<span></span>';
      html += nextItem
        ? '<button class="scene-nav-btn scene-nav-next" data-nav-part="' + nextItem.partId + '" data-nav-scene="' + nextItem.sceneId + '"><span class="scene-nav-dir">다음 씬 →</span><span class="scene-nav-title">' + escapeHtml(nextItem.sceneTitle) + '</span></button>'
        : '<span></span>';
      html += '</div>';
    }

    main.innerHTML = html;

    main.querySelectorAll('[data-nav-scene]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.currentPartId = btn.getAttribute('data-nav-part');
        state.currentSceneId = btn.getAttribute('data-nav-scene');
        state.openParts[state.currentPartId] = true;
        renderTree();
        renderMain();
        main.scrollTop = 0;
      });
    });

    main.querySelectorAll('[data-copy-block]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var block = findBlock(scene, btn.getAttribute('data-copy-block'));
        copyText(block ? block.content : '', btn);
      });
    });
    main.querySelectorAll('[data-copy-raw]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        copyText(btn.getAttribute('data-copy-raw'), btn);
      });
    });
    var copyAllBtn = main.querySelector('[data-copy-all]');
    if (copyAllBtn) {
      copyAllBtn.addEventListener('click', function () {
        var lines = [scene.title, ''];
        scene.blocks.forEach(function (block) {
          if ((block.type === 'text' || block.type === 'memo' || block.type === 'truth') && block.content) {
            lines.push('[' + block.label + ']', block.content, '');
          }
        });
        copyText(lines.join('\n'), copyAllBtn);
      });
    }
  }

  /* ---------- 타임라인 / 플로우차트 뷰 ---------- */

  function renderTimelineMode(main, scenario) {
    var platform = currentPlatform();
    var html = '';
    html += '<div class="scene-header" style="border-bottom:none; margin-bottom:14px;">';
    html += '<div style="flex:1; min-width:0;">';
    html += '<div class="breadcrumb">' + escapeHtml(platform ? platform.name : '') + ' / ' + escapeHtml(scenario.title) + '</div>';
    html += '<h1 class="scene-play-title">타임라인</h1>';
    html += '</div></div>';

    if (!scenario.parts.length) {
      html += '<div class="timeline-empty">아직 파트가 없어요.<br>왼쪽에서 파트와 씬을 먼저 만들어주세요.</div>';
      main.innerHTML = html;
      return;
    }

    html += '<div class="timeline-wrap">';
    scenario.parts.forEach(function (part, partIdx) {
      var doneCount = part.scenes.filter(function (s) { return s.done; }).length;
      html += '<div class="timeline-part">';
      html += '<div class="timeline-part-title">' + escapeHtml(part.title) + '<span class="part-count">' + doneCount + '/' + part.scenes.length + '</span></div>';
      if (!part.scenes.length) {
        html += '<div class="timeline-empty" style="padding:16px 0; text-align:left;">이 파트엔 아직 씬이 없어요.</div>';
      } else {
        html += '<div class="timeline-row">';
        part.scenes.forEach(function (scene, sceneIdx) {
          var branchCount = 0, checkCount = 0;
          (scene.blocks || []).forEach(function (b) {
            if (b.type === 'branches') branchCount += (b.items || []).length;
            if (b.type === 'checks') checkCount += (b.items || []).length;
          });
          var active = scene.id === state.currentSceneId && part.id === state.currentPartId;
          html += '<div class="timeline-node' + (active ? ' is-active' : '') + (scene.done ? ' is-done' : '') + '" data-tl-part="' + part.id + '" data-tl-scene="' + scene.id + '">';
          html += '<div class="timeline-node-title">' + escapeHtml(scene.title) + '</div>';
          html += '<div class="timeline-node-badges">';
          if (scene.done) html += '<span class="timeline-badge done">' + ICONS.check + ' 완료</span>';
          if (branchCount) html += '<span class="timeline-badge branch">' + ICONS.branch + ' ' + branchCount + '</span>';
          if (checkCount) html += '<span class="timeline-badge check">' + ICONS.dice + ' ' + checkCount + '</span>';
          html += '</div></div>';
          if (sceneIdx < part.scenes.length - 1) html += '<div class="timeline-arrow">→</div>';
        });
        html += '</div>';
      }
      if (partIdx < scenario.parts.length - 1) html += '<div class="timeline-part-arrow-down">↓</div>';
      html += '</div>';
    });
    html += '</div>';

    main.innerHTML = html;

    main.querySelectorAll('[data-tl-scene]').forEach(function (node) {
      node.addEventListener('click', function () {
        state.currentPartId = node.getAttribute('data-tl-part');
        state.currentSceneId = node.getAttribute('data-tl-scene');
        state.openParts[state.currentPartId] = true;
        state.mode = 'edit';
        document.querySelectorAll('.mode-switch button[data-mode]').forEach(function (b) {
          b.classList.toggle('is-active', b.getAttribute('data-mode') === 'edit');
        });
        renderTree();
        renderMain();
      });
    });
  }

  function renderTextPlayBox(content) {
    if (!content) return '<div class="field-play-box is-empty"></div>';
    return '<div class="field-play-box text-lines">' + renderLinesInline(content) + '</div>';
  }

  // 여러 줄 텍스트를 한 줄씩 나눠서, 줄마다 개별 복사 버튼을 붙여 렌더링
  function renderLinesInline(text) {
    if (!text) return '';
    var lines = text.split('\n');
    var html = '';
    lines.forEach(function (line) {
      if (!line.trim()) {
        html += '<div class="text-line-empty">&nbsp;</div>';
        return;
      }
      html += '<div class="text-line"><span>' + escapeHtml(line) + '</span><button class="copy-btn line-copy-btn" data-copy-raw="' + escapeHtml(line) + '">' + ICONS.copy + '</button></div>';
    });
    return html;
  }

  function outcomeRow(cls, label, text) {
    if (!text) return '';
    return '<div class="play-outcome-row"><span class="play-outcome-tag ' + cls + '">' + label + '</span><div class="play-outcome-text text-lines">' + renderLinesInline(text) + '</div></div>';
  }

  function copyText(text, btn) {
    var done = function () {
      var original = btn.innerHTML;
      btn.classList.add('is-copied');
      btn.innerHTML = ICONS.check + ' 복사됨';
      setTimeout(function () { btn.classList.remove('is-copied'); btn.innerHTML = original; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text || '').then(done).catch(function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text);
      done();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text || '';
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function insertAtCursor(textarea, text) {
    if (!textarea) return;
    var start = textarea.selectionStart, end = textarea.selectionEnd;
    var val = textarea.value;
    textarea.value = val.slice(0, start) + text + val.slice(end);
    textarea.selectionStart = textarea.selectionEnd = start + text.length;
    textarea.focus();
    var event = new Event('input', { bubbles: true });
    textarea.dispatchEvent(event);
  }

  /* ================= 모달 로직 ================= */

  function openPrompt(title, initial, onOk) {
    var modal = document.getElementById('prompt-modal');
    document.getElementById('prompt-modal-title').textContent = title;
    var input = document.getElementById('prompt-modal-input');
    input.value = initial || '';
    modal.hidden = false;
    setTimeout(function () { input.focus(); input.select(); }, 30);

    function close() { modal.hidden = true; cleanup(); }
    function ok() { var v = input.value.trim(); close(); onOk(v); }
    function key(e) { if (e.key === 'Enter') ok(); if (e.key === 'Escape') close(); }

    function cleanup() {
      document.getElementById('prompt-modal-ok').removeEventListener('click', ok);
      document.getElementById('prompt-modal-cancel').removeEventListener('click', close);
      input.removeEventListener('keydown', key);
    }
    document.getElementById('prompt-modal-ok').addEventListener('click', ok);
    document.getElementById('prompt-modal-cancel').addEventListener('click', close);
    input.addEventListener('keydown', key);
  }

  function openPlatformModal() {
    var modal = document.getElementById('platform-modal');
    var nameInput = document.getElementById('platform-name-input');
    var swatchWrap = document.getElementById('platform-color-swatches');
    var selectedColor = PLATFORM_COLORS[state.data.platforms.length % PLATFORM_COLORS.length];
    nameInput.value = '';
    swatchWrap.innerHTML = PLATFORM_COLORS.map(function (c) {
      return '<span class="color-swatch' + (c === selectedColor ? ' is-selected' : '') + '" style="background:' + c + '" data-color="' + c + '"></span>';
    }).join('');
    swatchWrap.querySelectorAll('.color-swatch').forEach(function (sw) {
      sw.addEventListener('click', function () {
        selectedColor = sw.getAttribute('data-color');
        swatchWrap.querySelectorAll('.color-swatch').forEach(function (s) { s.classList.remove('is-selected'); });
        sw.classList.add('is-selected');
      });
    });
    modal.hidden = false;
    setTimeout(function () { nameInput.focus(); }, 30);

    function close() { modal.hidden = true; cleanup(); }
    function ok() {
      var name = nameInput.value.trim();
      if (!name) { close(); return; }
      var p = { id: uid(), name: name, color: selectedColor, commands: [] };
      state.data.platforms.push(p);
      state.currentPlatformId = p.id;
      saveData();
      close();
      render();
    }
    function cleanup() {
      document.getElementById('platform-modal-ok').removeEventListener('click', ok);
      document.getElementById('platform-modal-cancel').removeEventListener('click', close);
    }
    document.getElementById('platform-modal-ok').addEventListener('click', ok);
    document.getElementById('platform-modal-cancel').addEventListener('click', close);
  }

  function openCommandModal() {
    var platform = currentPlatform() || state.data.platforms[0];
    if (!platform) { showToast('먼저 사이트를 추가해주세요'); return; }
    if (!platform.colors) platform.colors = [];
    var modal = document.getElementById('command-modal');
    document.getElementById('command-modal-platform').textContent = platform.name;
    state.openCommandId = null;
    renderCommandModalList(platform);
    renderColorPaletteList(platform);
    modal.hidden = false;

    function close() { modal.hidden = true; render(); cleanup(); }
    function cleanup() {
      document.getElementById('command-modal-close').removeEventListener('click', close);
      document.getElementById('command-modal-done').removeEventListener('click', close);
    }
    document.getElementById('command-modal-close').addEventListener('click', close);
    document.getElementById('command-modal-done').addEventListener('click', close);
    document.getElementById('add-command-btn').onclick = function () {
      var c = { id: uid(), label: '새 명령어', snippet: '' };
      platform.commands.push(c);
      state.openCommandId = c.id;
      saveData();
      renderCommandModalList(platform);
    };

    // 색상 팔레트 저장
    var picker = document.getElementById('color-quickadd-picker');
    var hexInput = document.getElementById('color-quickadd-hex');
    var labelInput = document.getElementById('color-quickadd-label');
    var addBtn = document.getElementById('color-quickadd-btn');
    labelInput.value = '';
    picker.oninput = function () { hexInput.value = picker.value; };
    hexInput.oninput = function () {
      var v = hexInput.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(v)) picker.value = v;
    };
    addBtn.onclick = function () {
      var hex = hexInput.value.trim();
      if (!/^#[0-9a-fA-F]{6}$/.test(hex)) { showToast('#으로 시작하는 6자리 헥스코드를 입력해주세요'); return; }
      var name = labelInput.value.trim() || hex;
      platform.colors.push({ id: uid(), name: name, hex: hex });
      saveData();
      labelInput.value = '';
      renderColorPaletteList(platform);
      labelInput.focus();
    };
  }

  function renderColorPaletteList(platform) {
    var wrap = document.getElementById('color-palette-list');
    if (!platform.colors || !platform.colors.length) {
      wrap.innerHTML = '<p style="font-size:12px; color:var(--faint); margin:0;">아직 저장된 색상이 없어요.</p>';
      return;
    }
    var html = '';
    platform.colors.forEach(function (c) {
      html += '<div class="palette-row" data-color-item="' + c.id + '">';
      html += '<span class="palette-swatch" style="background:' + c.hex + '"></span>';
      html += '<span class="palette-name">' + escapeHtml(c.name) + '</span>';
      html += '<span class="palette-hex">' + c.hex.toUpperCase() + '</span>';
      html += '<button class="copy-btn" data-palette-copy="' + c.hex + '">' + ICONS.copy + '</button>';
      html += '<button class="remove-btn" data-palette-del="' + c.id + '">' + ICONS.trash + '</button>';
      html += '</div>';
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-palette-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        copyText(btn.getAttribute('data-palette-copy'), btn);
      });
    });
    wrap.querySelectorAll('[data-palette-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        platform.colors = platform.colors.filter(function (c) { return c.id !== btn.getAttribute('data-palette-del'); });
        saveData();
        renderColorPaletteList(platform);
      });
    });
  }

  function renderCommandModalList(platform) {
    var wrap = document.getElementById('command-list');

    if (!platform.commands.length) {
      wrap.innerHTML = '<p style="font-size:12.5px; color:var(--faint);">아직 등록된 명령어가 없어요. 아래에서 추가해보세요.</p>';
      return;
    }

    var openId = state.openCommandId;
    var openCmd = platform.commands.find(function (c) { return c.id === openId; });

    var html = '<div class="command-chip-row" id="command-chip-row">';
    platform.commands.forEach(function (c) {
      html += '<button class="command-manage-chip' + (c.id === openId ? ' is-active' : '') + '" data-command-chip="' + c.id + '" draggable="true">' + escapeHtml(c.label || '(이름 없음)') + '</button>';
    });
    html += '</div>';

    if (openCmd) {
      html += '<div class="command-editor" data-command-editor="' + openCmd.id + '">';
      html += '<label class="npc-sub-label" style="margin-top:0;">버튼에 표시될 이름</label>';
      html += '<input type="text" placeholder="예: 굵게" data-cmd-label="' + openCmd.id + '" value="' + escapeHtml(openCmd.label) + '">';
      html += '<label class="npc-sub-label">실제로 삽입될 텍스트/코드</label>';
      html += '<textarea class="snippet" data-cmd-snippet="' + openCmd.id + '" rows="1">' + escapeHtml(openCmd.snippet) + '</textarea>';
      html += '<button class="tbtn danger" style="margin-top:10px;" data-cmd-del="' + openCmd.id + '">' + ICONS.trash + ' 이 명령어 삭제</button>';
      html += '</div>';
    } else {
      html += '<p style="font-size:12px; color:var(--faint); margin:10px 2px 0;">위에서 명령어를 눌러 이름·내용을 수정하세요. 드래그해서 순서도 바꿀 수 있어요.</p>';
    }

    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-command-chip]').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var id = chip.getAttribute('data-command-chip');
        state.openCommandId = (state.openCommandId === id) ? null : id;
        renderCommandModalList(platform);
      });
    });

    var draggedId = null;
    wrap.querySelectorAll('[data-command-chip]').forEach(function (chip) {
      chip.addEventListener('dragstart', function (e) {
        draggedId = chip.getAttribute('data-command-chip');
        chip.classList.add('is-dragging');
        if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', draggedId); }
      });
      chip.addEventListener('dragend', function () { chip.classList.remove('is-dragging'); });
      chip.addEventListener('dragover', function (e) { e.preventDefault(); });
      chip.addEventListener('drop', function (e) {
        e.preventDefault();
        var targetId = chip.getAttribute('data-command-chip');
        if (!draggedId || draggedId === targetId) return;
        var fromIdx = platform.commands.findIndex(function (c) { return c.id === draggedId; });
        var toIdx = platform.commands.findIndex(function (c) { return c.id === targetId; });
        if (fromIdx === -1 || toIdx === -1) return;
        var moved = platform.commands.splice(fromIdx, 1)[0];
        platform.commands.splice(toIdx, 0, moved);
        saveData();
        renderCommandModalList(platform);
      });
    });

    wrap.querySelectorAll('[data-cmd-label]').forEach(function (input) {
      input.addEventListener('input', function () {
        findCommand(platform, input.getAttribute('data-cmd-label')).label = input.value;
        saveData();
        var chip = wrap.querySelector('[data-command-chip="' + input.getAttribute('data-cmd-label') + '"]');
        if (chip) chip.textContent = input.value || '(이름 없음)';
      });
    });
    wrap.querySelectorAll('[data-cmd-snippet]').forEach(function (input) {
      input.addEventListener('input', function () {
        findCommand(platform, input.getAttribute('data-cmd-snippet')).snippet = input.value;
        saveData();
      });
    });
    wrap.querySelectorAll('[data-cmd-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        platform.commands = platform.commands.filter(function (c) { return c.id !== btn.getAttribute('data-cmd-del'); });
        state.openCommandId = null;
        saveData();
        renderCommandModalList(platform);
      });
    });
    autoResizeAllTextareas(wrap);
  }
  function findCommand(platform, id) { return platform.commands.find(function (c) { return c.id === id; }); }

  /* ---------- NPC / 아이템 / 장소 라이브러리 ---------- */

  var LIBRARY_LABELS = { npcs: 'NPC', items: '아이템', places: '장소' };
  var LIBRARY_BLOCK_TYPE = { npcs: 'npc', items: 'item', places: 'place' };

  function makeLibraryEntry(tab) {
    if (tab === 'npcs') return { id: uid(), name: '', imageUrl: '', role: '', traits: '', lines: '' };
    return { id: uid(), name: '', imageUrl: '', description: '', gmNote: '' };

  function openLibraryModal() {

    var modal = document.getElementById('library-modal');
    modal.hidden = false;
    renderLibraryTabs();
    updateLibrarySceneHint();
    renderLibraryList();

    function close() { modal.hidden = true; cleanup(); render(); }

      document.getElementById('library-modal-close').removeEventListener('click', close);
      document.getElementById('library-modal-done').removeEventListener('click', close);
    }
    document.getElementById('library-modal-close').addEventListener('click', close);
    document.getElementById('library-modal-done').addEventListener('click', close);

          var chip = wrap.querySelector('[data-lib-chip="' + openEntry.id + '"]');

          block.description = openEntry.description; block.gmNote = openEntry.gmNote;

      });
    });
    wrap.querySelectorAll('[data-lib-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm('"' + (openEntry.name || '이 항목') + '"을(를) 라이브러리에서 삭제할까요?')) return;
        state.data.library[tab] = lib.filter(function (e) { return e.id !== btn.getAttribute('data-lib-del'); });
        state.openLibraryId = null;
        saveData();
        renderLibraryList();
      });
    });
    autoResizeAllTextareas(wrap);
  }

  /* ---------- 찾기·바꾸기 ---------- */

  function getAllScenesFlat() {
    var out = [];
    state.data.scenarios.forEach(function (scenario) {
      scenario.parts.forEach(function (part) {
        part.scenes.forEach(function (scene) {
          out.push({ scenario: scenario, part: part, scene: scene });
        });
      });
    });
    return out;
  }

  function collectSceneTextRefs(scene) {
    var refs = [];
    (scene.blocks || []).forEach(function (block) {
      if (block.type === 'text' || block.type === 'memo' || block.type === 'truth') {
        refs.push({ block: block, get: function () { return block.content; }, set: function (v) { block.content = v; } });
      } else if (block.type === 'branches' || block.type === 'lines') {
        block.items.forEach(function (b) {
          refs.push({ block: block, get: function () { return b.label; }, set: function (v) { b.label = v; } });
          refs.push({ block: block, get: function () { return b.text; }, set: function (v) { b.text = v; } });
        });
      } else if (block.type === 'checks') {
        block.items.forEach(function (c) {
          refs.push({ block: block, get: function () { return c.name; }, set: function (v) { c.name = v; } });
          ['critSuccess', 'success', 'fail', 'critFail'].forEach(function (k) {
            refs.push({ block: block, get: function () { return c[k]; }, set: function (v) { c[k] = v; } });
          });
        });
      } else if (block.type === 'npc') {
        ['name', 'role', 'traits', 'lines'].forEach(function (k) {
          refs.push({ block: block, get: function () { return block[k]; }, set: function (v) { block[k] = v; } });
        });
      } else if (block.type === 'handout') {
        ['title', 'content', 'gmNote'].forEach(function (k) {
          refs.push({ block: block, get: function () { return block[k]; }, set: function (v) { block[k] = v; } });
        });
      } else if (block.type === 'bgm') {
        ['title', 'note'].forEach(function (k) {
          refs.push({ block: block, get: function () { return block[k]; }, set: function (v) { block[k] = v; } });
        });
      } else if (block.type === 'item' || block.type === 'place') {
        ['name', 'description', 'gmNote'].forEach(function (k) {
          refs.push({ block: block, get: function () { return block[k]; }, set: function (v) { block[k] = v; } });
        });
      }
    });
    return refs;
  }

  function collectTextRefs(sceneOnly) {
    // { get, set } 형태로 텍스트 필드에 대한 참조 목록을 만든다.
    // sceneOnly가 true면 현재 열려있는 씬 안에서만 찾는다.
    if (sceneOnly) {
      var scene = getCurrentScene();
      return scene ? collectSceneTextRefs(scene) : [];
    }
    var refs = [];
    getAllScenesFlat().forEach(function (e) {
      refs = refs.concat(collectSceneTextRefs(e.scene));
    });
    return refs;
  }

  function collectBlockTexts(block) {
    var texts = [];
    if (block.type === 'text' || block.type === 'memo' || block.type === 'truth') {
      texts.push(block.content);
    } else if (block.type === 'branches' || block.type === 'lines') {
      (block.items || []).forEach(function (i) { texts.push(i.label, i.text); });
    } else if (block.type === 'checks') {
      (block.items || []).forEach(function (c) { texts.push(c.name, c.critSuccess, c.success, c.fail, c.critFail); });
    } else if (block.type === 'npc') {
      texts.push(block.name, block.role, block.traits, block.lines);
    } else if (block.type === 'handout') {
      texts.push(block.title, block.content, block.gmNote);
    } else if (block.type === 'bgm') {
      texts.push(block.title, block.note);
    } else if (block.type === 'item' || block.type === 'place') {
      texts.push(block.name, block.description, block.gmNote);
    }
    return texts;
  }

  function searchAcrossScenes(term) {
    var results = [];
    if (!term) return results;
    var lowerTerm = term.toLowerCase();
    getAllScenesFlat().forEach(function (e) {
      var scenario = e.scenario, part = e.part, scene = e.scene;
      var count = 0;
      var snippet = '';
      if (scene.title && scene.title.toLowerCase().indexOf(lowerTerm) > -1) count++;
      (scene.blocks || []).forEach(function (block) {
        collectBlockTexts(block).forEach(function (t) {
          if (!t) return;
          var idx = t.toLowerCase().indexOf(lowerTerm);
          if (idx === -1) return;
          count++;
          if (!snippet) {
            var start = Math.max(0, idx - 16);
            var end = Math.min(t.length, idx + term.length + 30);
            snippet = (start > 0 ? '…' : '') + t.slice(start, end) + (end < t.length ? '…' : '');
          }
        });
      });
      if (count > 0) {
        results.push({ scenario: scenario, part: part, scene: scene, count: count, snippet: snippet });
      }
    });
    return results;
  }

  // 지금 열려있는 씬 "안에서만" 검색 - 블록 단위로 결과를 반환
  function searchWithinScene(scene, term) {
    var results = [];
    if (!scene || !term) return results;
    var lowerTerm = term.toLowerCase();
    (scene.blocks || []).forEach(function (block) {
      var meta = BLOCK_TYPES[block.type] || BLOCK_TYPES.text;
      var count = 0;
      var snippet = '';
      collectBlockTexts(block).forEach(function (t) {
        if (!t) return;
        var idx = 0;
        while (true) {
          idx = t.toLowerCase().indexOf(lowerTerm, idx);
          if (idx === -1) break;
          count++;
          if (!snippet) {
            var start = Math.max(0, idx - 16);
            var end = Math.min(t.length, idx + term.length + 30);
            snippet = (start > 0 ? '…' : '') + t.slice(start, end) + (end < t.length ? '…' : '');
          }
          idx += term.length;
        }
      });
      if (count > 0) {
        results.push({ block: block, blockLabel: block.label || meta.label, color: meta.color, count: count, snippet: snippet });
      }
    });
    return results;
  }

  function countMatches(term, sceneOnly) {
    if (!term) return 0;
    var refs = collectTextRefs(sceneOnly);
    var total = 0;
    refs.forEach(function (r) {
      var v = r.get() || '';
      var idx = 0;
      while (true) {
        idx = v.indexOf(term, idx);
        if (idx === -1) break;
        total++;
        idx += term.length;
      }
    });
    return total;
  }

  function applyReplace(term, replacement, sceneOnly) {
    var refs = collectTextRefs(sceneOnly);
    var changed = 0;
    refs.forEach(function (r) {
      var v = r.get() || '';
      if (v.indexOf(term) !== -1) {
        r.set(v.split(term).join(replacement));
        changed++;
      }
    });
    saveData();
    return changed;
  }

  function highlightTerm(text, term) {
    var idx = text.toLowerCase().indexOf(term.toLowerCase());
    if (idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + term.length)) + '</mark>' + escapeHtml(text.slice(idx + term.length));
  }

  function openReplaceModal() {
    var modal = document.getElementById('replace-modal');
    var findInput = document.getElementById('find-input');
    var replaceInput = document.getElementById('replace-input');
    var preview = document.getElementById('replace-preview');
    var replaceScopeDesc = document.getElementById('replace-scope-desc');
    var findOnlyInput = document.getElementById('find-only-input');
    var findResults = document.getElementById('find-results');
    var findPanel = document.getElementById('find-panel');
    var replacePanel = document.getElementById('replace-panel');
    var okBtn = document.getElementById('replace-modal-ok');
    var currentScene = getCurrentScene();

    var findScope = currentScene ? 'scene' : 'all';
    var replaceScope = currentScene ? 'scene' : 'all';

    findInput.value = ''; replaceInput.value = '';
    findOnlyInput.value = '';
    preview.innerHTML = '검색어를 입력하면 몇 건 발견됐는지 여기 보여드려요.';
    modal.hidden = false;

    function setupScopeSwitch(containerId, getScope, setScope, onChange) {
      var container = document.getElementById(containerId);
      var buttons = container.querySelectorAll('button');
      buttons.forEach(function (b) {
        var scope = b.getAttribute('data-scope');
        b.disabled = scope === 'scene' && !currentScene;
        b.classList.toggle('is-active', scope === getScope());
        b.onclick = function () {
          if (b.disabled) return;
          setScope(scope);
          buttons.forEach(function (x) { x.classList.toggle('is-active', x === b); });
          onChange();
        };
      });
    }

    function findScopeGet() { return findScope; }
    function findScopeSet(v) { findScope = v; }
    function replaceScopeGet() { return replaceScope; }
    function replaceScopeSet(v) {
      replaceScope = v;
      replaceScopeDesc.textContent = v === 'scene' ? '지금 열려있는 씬 안에서만 바꿉니다.' : '모든 시나리오의 본문·키퍼 메모·분기·판정 내용에서 한꺼번에 바꿉니다.';
      okBtn.textContent = v === 'scene' ? '이 씬에서 바꾸기' : '전체 바꾸기';
    }

    setupScopeSwitch('find-scope-switch', findScopeGet, findScopeSet, function () { updateFindResults(); });
    setupScopeSwitch('replace-scope-switch', replaceScopeGet, replaceScopeSet, function () { updatePreview(); });
    replaceScopeSet(replaceScope);

    function setSearchMode(mode) {
      document.querySelectorAll('#search-mode-switch button').forEach(function (b) {
        b.classList.toggle('is-active', b.getAttribute('data-search-mode') === mode);
      });
      findPanel.hidden = mode !== 'find';
      replacePanel.hidden = mode !== 'replace';
      okBtn.hidden = mode !== 'replace';
      setTimeout(function () {
        (mode === 'find' ? findOnlyInput : findInput).focus();
      }, 20);
    }
    document.querySelectorAll('#search-mode-switch button').forEach(function (btn) {
      btn.onclick = function () { setSearchMode(btn.getAttribute('data-search-mode')); };
    });
    setSearchMode('find');

    function focusBlockInScene(blockId) {
      close();
      setTimeout(function () {
        var el = document.querySelector('.field-block[data-block="' + blockId + '"]');
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('is-search-highlight');
        setTimeout(function () { el.classList.remove('is-search-highlight'); }, 1600);
      }, 60);
    }

    function updateFindResults() {
      var term = findOnlyInput.value.trim();
      if (!term) {
        findResults.innerHTML = '<p style="font-size:12.5px; color:var(--faint); margin:8px 2px 0;">검색어를 입력하면 ' + (findScope === 'scene' ? '이 씬 안에서' : '이 단어가 들어간 씬들을') + ' 보여드려요.</p>';
        return;
      }

      if (findScope === 'scene') {
        if (!currentScene) { findResults.innerHTML = '<p style="font-size:12.5px; color:var(--faint); margin:8px 2px 0;">먼저 씬을 선택해주세요.</p>'; return; }
        var blockResults = searchWithinScene(currentScene, term);
        if (!blockResults.length) { findResults.innerHTML = '<p style="font-size:12.5px; color:var(--faint); margin:8px 2px 0;">이 씬 안에서 일치하는 내용이 없어요.</p>'; return; }
        var html2 = '<p style="font-size:11.5px; color:var(--muted); margin:8px 2px 8px;">이 씬에서 ' + blockResults.length + '개 블록에서 발견됐어요</p>';
        blockResults.forEach(function (r) {
          html2 += '<div class="find-result-item" data-find-block="' + r.block.id + '">';
          html2 += '<div class="find-result-head"><span class="find-result-title"><span class="swatch" style="background:' + r.color + '; display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px;"></span>' + escapeHtml(r.blockLabel) + '</span><span class="find-result-count">' + r.count + '건</span></div>';
          if (r.snippet) html2 += '<div class="find-result-snippet">' + highlightTerm(r.snippet, term) + '</div>';
          html2 += '</div>';
        });
        findResults.innerHTML = html2;
        findResults.querySelectorAll('[data-find-block]').forEach(function (el) {
          el.addEventListener('click', function () { focusBlockInScene(el.getAttribute('data-find-block')); });
        });
        return;
      }

      var results = searchAcrossScenes(term);
      if (!results.length) {
        findResults.innerHTML = '<p style="font-size:12.5px; color:var(--faint); margin:8px 2px 0;">일치하는 내용이 없어요.</p>';
        return;
      }
      var html = '<p style="font-size:11.5px; color:var(--muted); margin:8px 2px 8px;">' + results.length + '개 씬에서 발견됐어요</p>';
      results.forEach(function (r) {
        html += '<div class="find-result-item" data-find-platform="' + r.scenario.platformId + '" data-find-scenario="' + r.scenario.id + '" data-find-part="' + r.part.id + '" data-find-scene="' + r.scene.id + '">';
        html += '<div class="find-result-head"><span class="find-result-title">' + escapeHtml(r.scene.title) + '</span><span class="find-result-count">' + r.count + '건</span></div>';
        html += '<div class="find-result-path">' + escapeHtml(r.scenario.title) + ' / ' + escapeHtml(r.part.title) + '</div>';
        if (r.snippet) html += '<div class="find-result-snippet">' + highlightTerm(r.snippet, term) + '</div>';
        html += '</div>';
      });
      findResults.innerHTML = html;
      findResults.querySelectorAll('[data-find-scene]').forEach(function (el) {
        el.addEventListener('click', function () {
          state.currentPlatformId = el.getAttribute('data-find-platform');
          state.currentScenarioId = el.getAttribute('data-find-scenario');
          state.currentPartId = el.getAttribute('data-find-part');
          state.currentSceneId = el.getAttribute('data-find-scene');
          state.openParts[state.currentPartId] = true;
          state.mode = 'edit';
          document.querySelectorAll('.mode-switch button[data-mode]').forEach(function (b) {
            b.classList.toggle('is-active', b.getAttribute('data-mode') === 'edit');
          });
          close();
          render();
        });
      });
    }
    updateFindResults();
    findOnlyInput.addEventListener('input', updateFindResults);

    setTimeout(function () { findOnlyInput.focus(); }, 30);

    function updatePreview() {
      var term = findInput.value;
      if (!term) {
        preview.innerHTML = '검색어를 입력하면 몇 건 발견됐는지 여기 보여드려요.';
        return;
      }
      var n = countMatches(term, replaceScope === 'scene');
      preview.innerHTML = (replaceScope === 'scene' ? '이 씬에서' : '전체 시나리오에서') + ' <b>' + n + '건</b> 발견됐어요.';
    }
    findInput.addEventListener('input', updatePreview);

    function close() { modal.hidden = true; cleanup(); }
    function ok() {
      var term = findInput.value;
      if (!term) { showToast('찾을 단어를 입력해주세요'); return; }
      var n = countMatches(term, replaceScope === 'scene');
      if (!n) { showToast('일치하는 내용이 없어요'); return; }
      if (!confirm(n + '건을 모두 바꿀까요? 되돌릴 수 없어요.')) return;
      var changed = applyReplace(term, replaceInput.value, replaceScope === 'scene');
      close();
      render();
      showToast(changed + '개 항목에서 바꿨어요');
    }
    function cleanup() {
      findInput.removeEventListener('input', updatePreview);
      findOnlyInput.removeEventListener('input', updateFindResults);
      document.getElementById('replace-modal-close').removeEventListener('click', close);
      document.getElementById('replace-modal-cancel').removeEventListener('click', close);
      document.getElementById('replace-modal-ok').removeEventListener('click', ok);
    }
    document.getElementById('replace-modal-close').addEventListener('click', close);
    document.getElementById('replace-modal-cancel').addEventListener('click', close);
    document.getElementById('replace-modal-ok').addEventListener('click', ok);
  }

  /* ---------- 내보내기 / 불러오기 / 초기화 ---------- */

  function exportData() {
    var blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var date = new Date().toISOString().slice(0, 10);
    var scenario = getCurrentScenario();
    var baseName = scenario ? scenario.title : '시나리오 대장간 백업';
    var safeName = baseName.replace(/[\\/:*?"<>|]/g, '').trim() || '시나리오 대장간 백업';
    a.href = url;
    a.download = safeName + '_' + date + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('JSON 파일로 내보냈어요');
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.platforms) || !Array.isArray(parsed.scenarios)) {
          throw new Error('형식 오류');
        }
        if (!confirm('불러온 파일로 현재 데이터를 덮어씌울까요? 지금 데이터는 사라져요.')) return;
        migrateData(parsed);
        state.data = parsed;
        state.currentPlatformId = null;
        state.currentScenarioId = null;
        state.currentPartId = null;
        state.currentSceneId = null;
        state.openParts = {};
        ensureSelection();
        ensureLibrary();
        resetHistory();
        saveData();
        render();
        showToast('불러오기 완료');
      } catch (e) {
        alert('올바른 시나리오 대장간 JSON 파일이 아니에요.');
      }
    };
    reader.readAsText(file);
  }

    if (!confirm('정말로 전체 초기화하시겠어요? 마지막 확인이에요.')) return;

    state.currentScenarioId = null;

    state.currentSceneId = null;

    resetHistory();

    render();
    showToast('전체 초기화했어요');
  }

  /* ---------- 사이드바 리사이즈 · 접기/펼치기 ---------- */
  var SIDEBAR_W_KEY = 'scenario-forge-sidebar-w';
  var SIDEBAR_COLLAPSED_KEY = 'scenario-forge-sidebar-collapsed';
  var appEl = document.querySelector('.app');
  var sidebarInner = document.querySelector('.sidebar-inner');

      savedW = localStorage.getItem(SIDEBAR_W_KEY);

  var resizer = document.getElementById('sidebar-resizer');
  if (resizer) {
    resizer.addEventListener('mousedown', function (e) {
      e.preventDefault();
      resizer.classList.add('is-dragging');
      document.body.style.userSelect = 'none';
      function onMove(ev) { setSidebarWidth(ev.clientX); }
      function onUp() {
        resizer.classList.remove('is-dragging');
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);

  var collapseBtn = document.getElementById('sidebar-collapse-btn');
  if (collapseBtn) collapseBtn.addEventListener('click', function () { setSidebarCollapsed(true); });
  var reopenBtn = document.getElementById('sidebar-reopen-btn');
  if (reopenBtn) reopenBtn.addEventListener('click', function () { setSidebarCollapsed(false); });

  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key === 'b' || e.key === 'B')) {
      e.preventDefault();
      setSidebarCollapsed(!appEl.classList.contains('sidebar-collapsed'));
    }
  });

  /* ---------- 글자 크기 조절 ---------- */
  var UI_SCALE_KEY = 'scenario-forge-ui-scale';
  function applyUiScale(scale) {
    document.body.style.zoom = scale;
    document.querySelectorAll('#font-scale-switch button').forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-scale') === String(scale));
    });
    try { localStorage.setItem(UI_SCALE_KEY, scale); } catch (e) {}
  }
  document.querySelectorAll('#font-scale-switch button').forEach(function (btn) {
    btn.addEventListener('click', function () { applyUiScale(btn.getAttribute('data-scale')); });
  });
  (function () {
    var saved = '1';
    try { saved = localStorage.getItem(UI_SCALE_KEY) || '1'; } catch (e) {}
    applyUiScale(saved);
  })();

  /* ---------- 입력칸 자동 높이 조정 ---------- */
  document.addEventListener('input', function (e) {
    if (e.target && e.target.tagName === 'TEXTAREA') autoResizeTextarea(e.target);
  });

  /* ---------- 단축키 ---------- */
  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    if (e.key === 's' || e.key === 'S') {
      e.preventDefault();
      saveData();
      showToast('저장됨');
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      openReplaceModal();
    } else if ((e.key === 'z' || e.key === 'Z') && !e.shiftKey) {
      e.preventDefault();
      undo();
    } else if ((e.key === 'z' || e.key === 'Z') && e.shiftKey) {
      e.preventDefault();
      redo();
    } else if (e.key === 'y' || e.key === 'Y') {
      e.preventDefault();
      redo();
    }
  });

  /* ================= 초기 실행 ================= */
  ensureSelection();
  ensureLibrary();
  resetHistory();
  render();
  updateSaveIndicator();
})();
</script>
</body>
</html>
